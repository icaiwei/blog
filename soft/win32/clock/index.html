	HWND hWnd,			//窗口句柄
    UINT_PTR nIDEvent,	//定时器ID
    UINT uElapse,		//时间间隔ms
    TIMERPROC lpTimerFunc	//定时器处理函数指针，一般不用，为NULL
);	//创建成功，返回非0
// 关闭定时器
BOOL KillTimer(
	HWND hWnd,
    UINT_PTR uIDEvent
);

*   Author:icaiwei
*   Date:2022/11/6 0006
*/

#include &lt;Windows.h&gt;
#include &lt;cstdio&gt;

HANDLE g_hOutput = nullptr;//接收标准输出句柄

void OnTimer(HWND pHwnd, WPARAM param);

//窗口处理函数
LRESULT CALLBACK WndProc(HWND hWnd, UINT msgID, WPARAM wParam, LPARAM lParam) {
    switch (msgID)
    {
        case WM_CREATE:
            SetTimer(hWnd,1,1000,nullptr);
            SetTimer(hWnd,2,2000,nullptr);
            break;
        case WM_TIMER:
            OnTimer(hWnd,wParam);
            break;
        case WM_DESTROY:
            PostQuitMessage(0);//可以使GetMessage函数返回0
            break;
        default:
            break;
    }
    return DefWindowProc(hWnd, msgID, wParam, lParam);
}

void OnTimer(HWND hWnd, WPARAM wParam) {
    char szText[256];
    sprintf_s(szText,&quot;WM_TIMER:定时器ID=%d\n&quot;,wParam);
    WriteConsole(g_hOutput,szText, strlen(szText),nullptr, nullptr);
}

//入口函数
int CALLBACK WinMain(HINSTANCE hInstance, HINSTANCE hPreInstance, LPSTR lpCmdLine, int nCmdShow) {
    //增加DOS
    AllocConsole();
    g_hOutput = GetStdHandle(STD_OUTPUT_HANDLE);
    // 注册窗口类
    WNDCLASS wc = { 0 };
    wc.cbClsExtra = 0;
    wc.cbWndExtra = 0;
    wc.hbrBackground = (HBRUSH)(COLOR_WINDOW + 1);
    wc.hCursor = nullptr;
    wc.hIcon = nullptr;
    wc.hInstance = hInstance;
    wc.lpfnWndProc = WndProc;
    wc.lpszClassName = &quot;Main&quot;;
    wc.lpszMenuName = nullptr;
    wc.style = CS_HREDRAW | CS_VREDRAW | CS_DBLCLKS;

    RegisterClass(&amp;wc);

    //在内存中创建窗口
    char* pszText = (char*)&quot;hello data&quot;;
    HWND hWnd = CreateWindowEx(0, &quot;Main&quot;, &quot;Window&quot;, WS_OVERLAPPEDWINDOW, 100, 100, 500, 500, nullptr, nullptr, hInstance, pszText);
    //显示窗口
    ShowWindow(hWnd, SW_SHOW);
    UpdateWindow(hWnd);
    // 消息循环，避免窗口消失
    MSG nMsg = { nullptr };
    while (GetMessage(&amp;nMsg, nullptr, 0, 0))
    {
        TranslateMessage(&amp;nMsg);
        //将消息交给窗口处理函数
        DispatchMessage(&amp;nMsg);
    }
    return 0;
