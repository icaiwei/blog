class CwCalculation
{
public:
	/// &lt;summary&gt;
	/// 求两个坐标中间值
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;pt1&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;pt2&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static AcGePoint2d MiddlePoint(AcGePoint2d pt1, AcGePoint2d pt2);

	static AcGePoint3d MiddlePoint(AcGePoint3d pt1, AcGePoint3d pt2);

	/// &lt;summary&gt;
	/// 根据三点求出中心
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;pt1&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;pt2&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;pt3&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static AcGePoint2d CenterPoint(AcGePoint2d pt1, AcGePoint2d pt2, AcGePoint2d pt3);

	/// &lt;summary&gt;
	/// 根据圆心和圆上任意一点，求半径
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;ptCenter&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;pt&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double GetRadius(AcGePoint2d ptCenter, AcGePoint2d pt);

	/// &lt;summary&gt;
	/// 二维坐标转三维坐标
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;pt&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static AcGePoint3d Pt2dto3d(AcGePoint2d pt);
	static AcGePoint2d Pt3dto2d(const AcGePoint3d&amp; pt);

	/// &lt;summary&gt;
	/// 计算π
	/// &lt;/summary&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double PI();

	/// &lt;summary&gt;
	/// 半径转弧度
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;radian&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double RtoA(double radian);
	/// &lt;summary&gt;
	/// 弧度转半径
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;angle&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double AtoR(double angle);

	/// &lt;summary&gt;
	/// 极坐标
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;pt&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;angle&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;distance&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static AcGePoint3d PolarPoint(const AcGePoint3d&amp; pt, double angle, double distance);
	/// &lt;summary&gt;
	/// 相对坐标
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;pt&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;x&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;y&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static AcGePoint3d RelativePoint(AcGePoint3d&amp; pt, double x, double y);
	/// &lt;summary&gt;
	/// 英寸转mm
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;mil&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double Mil2MM(double mil);
	/// &lt;summary&gt;
	/// 求最大值
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;a&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;b&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double Max(double a, double b);
	/// &lt;summary&gt;
	/// 求最小值
	/// &lt;/summary&gt;
	/// &lt;param name=&quot;a&quot;&gt;&lt;/param&gt;
	/// &lt;param name=&quot;b&quot;&gt;&lt;/param&gt;
	/// &lt;returns&gt;&lt;/returns&gt;
	static double Min(double a, double b);

AcGePoint2d CwCalculation::MiddlePoint(AcGePoint2d pt1, AcGePoint2d pt2)
{
	AcGePoint2d pt;
	pt[X] = (pt1[X] + pt2[X]) / 2;
	pt[Y] = (pt1[Y] + pt2[Y]) / 2;
	return pt;
}

AcGePoint3d CwCalculation::MiddlePoint(AcGePoint3d pt1, AcGePoint3d pt2)
{
	AcGePoint3d pt;
	pt[X] = (pt1[X] + pt2[X]) / 2;
	pt[Y] = (pt1[Y] + pt2[Y]) / 2;
	pt[Z] = (pt1[Z] + pt2[Z]) / 2;
	return pt;
}

AcGePoint2d CwCalculation::CenterPoint(AcGePoint2d pt1, AcGePoint2d pt2, AcGePoint2d pt3)
{
	AcGePoint2d ptCenter;
	double a = pt1[X] - pt2[X];
	double b = pt1[Y] - pt2[Y];
	double c = pt1[X] - pt3[X];
	double d = pt1[Y] - pt3[Y];
	double e = ((pow(pt1[X], 2) - pow(pt2[X], 2)) - (pow(pt2[Y], 2) - pow(pt1[Y], 2))) / 2;
	double f = ((pow(pt1[X], 2) - pow(pt3[X], 2)) - (pow(pt3[Y], 2) - pow(pt1[Y], 2))) / 2;
	ptCenter[X] = (e * d - b * f) / (a * d - b * c);
	ptCenter[Y] = (a * f - e * c) / (a * d - b * c);
	return ptCenter;
}

double CwCalculation::GetRadius(AcGePoint2d ptCenter, AcGePoint2d pt)
{
	double radius = abs(sqrt(pow(ptCenter[X] - pt[X], 2) + pow(ptCenter[Y] - pt[Y], 2)));
	return radius;
}

}

AcDbObjectId CwEntity::CreateCircle(AcGePoint2d pt1, AcGePoint2d pt2)
{
	//计算圆心和半径
	AcGePoint2d pt = CwCalculation::MiddlePoint(pt1, pt2);
	AcGePoint3d ptCenter(pt[X], pt[Y], 0);
	double radius = (pt1.distanceTo(pt2)) / 2;
	return CwEntity::CreateCircle(ptCenter, radius);
}

AcDbObjectId CwEntity::CreateCircle(AcGePoint2d pt1, AcGePoint2d pt2, AcGePoint2d pt3)
{
	AcGePoint2d ptCenter2d = CwCalculation::CenterPoint(pt1, pt2, pt3);
	double radius = CwCalculation::GetRadius(ptCenter2d, pt1);
	AcGePoint3d ptCenter = CwCalculation::Pt2dto3d(ptCenter2d);
	if (radius &lt; 0.000001)
	{
		MessageBox(NULL, TEXT(&quot;半径过小!&quot;), TEXT(&quot;错误&quot;), MB_OK);
		return 0;
	}
	return CwEntity::CreateCircle(ptCenter, radius);
}
