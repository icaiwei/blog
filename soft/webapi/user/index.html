/// 分页拓展类
/// &lt;/summary&gt;
public static class PageResult
{
    /// &lt;summary&gt;
    /// 分页拓展
    /// &lt;/summary&gt;
    /// &lt;param name=&quot;query&quot;&gt;&lt;see cref=&quot;ISugarQueryable{TEntity}&quot;/&gt;对象&lt;/param&gt;
    /// &lt;param name=&quot;pageIndex&quot;&gt;当前页码，从1开始&lt;/param&gt;
    /// &lt;param name=&quot;pageSize&quot;&gt;页码容量&lt;/param&gt;
    /// &lt;param name=&quot;expression&quot;&gt;查询结果 Select 表达式&lt;/param&gt;
    /// &lt;returns&gt;&lt;/returns&gt;
    public static PageResult&lt;TResult&gt; ToPagedList&lt;TEntity, TResult&gt;(this ISugarQueryable&lt;TEntity&gt; query, int pageIndex, int pageSize,
        Expression&lt;Func&lt;TEntity, TResult&gt;&gt; expression)
    {
        var total = 0;
        var items = query.ToPageList(pageIndex, pageSize, ref total, expression);
        return CreatePagedList(items, total, pageIndex, pageSize);
    }

    /// &lt;summary&gt;
    /// 分页拓展
    /// &lt;/summary&gt;
    /// &lt;param name=&quot;query&quot;&gt;&lt;see cref=&quot;ISugarQueryable{TEntity}&quot;/&gt;对象&lt;/param&gt;
    /// &lt;param name=&quot;pageIndex&quot;&gt;当前页码，从1开始&lt;/param&gt;
    /// &lt;param name=&quot;pageSize&quot;&gt;页码容量&lt;/param&gt;
    /// &lt;returns&gt;&lt;/returns&gt;
    public static PageResult&lt;TEntity&gt; ToPagedList&lt;TEntity&gt;(this ISugarQueryable&lt;TEntity&gt; query, int pageIndex, int pageSize)
    {
        var total = 0;
        var items = query.ToPageList(pageIndex, pageSize, ref total);
        return CreatePagedList(items, total, pageIndex, pageSize);
    }

    /// &lt;summary&gt;
    /// 分页拓展
    /// &lt;/summary&gt;
    /// &lt;param name=&quot;query&quot;&gt;&lt;see cref=&quot;ISugarQueryable{TEntity}&quot;/&gt;对象&lt;/param&gt;
    /// &lt;param name=&quot;pageIndex&quot;&gt;当前页码，从1开始&lt;/param&gt;
    /// &lt;param name=&quot;pageSize&quot;&gt;页码容量&lt;/param&gt;
    /// &lt;param name=&quot;expression&quot;&gt;查询结果 Select 表达式&lt;/param&gt;
    /// &lt;returns&gt;&lt;/returns&gt;
    public static async Task&lt;PageResult&lt;TResult&gt;&gt; ToPagedListAsync&lt;TEntity, TResult&gt;(this ISugarQueryable&lt;TEntity&gt; query, int pageIndex, int pageSize,
        Expression&lt;Func&lt;TEntity, TResult&gt;&gt; expression)
    {
        RefAsync&lt;int&gt; total = 0;
        var items = await query.ToPageListAsync(pageIndex, pageSize, total, expression);
        return CreatePagedList(items, total, pageIndex, pageSize);
    }

    /// &lt;summary&gt;
    /// 分页拓展
    /// &lt;/summary&gt;
    /// &lt;param name=&quot;query&quot;&gt;&lt;see cref=&quot;ISugarQueryable{TEntity}&quot;/&gt;对象&lt;/param&gt;
    /// &lt;param name=&quot;pageIndex&quot;&gt;当前页码，从1开始&lt;/param&gt;
    /// &lt;param name=&quot;pageSize&quot;&gt;页码容量&lt;/param&gt;
    /// &lt;returns&gt;&lt;/returns&gt;
    public static async Task&lt;PageResult&lt;TEntity&gt;&gt; ToPagedListAsync&lt;TEntity&gt;(this ISugarQueryable&lt;TEntity&gt; query, int pageIndex, int pageSize)
    {
        RefAsync&lt;int&gt; total = 0;
        var items = await query.ToPageListAsync(pageIndex, pageSize, total);
        return CreatePagedList(items, total, pageIndex, pageSize);
    }

    /// &lt;summary&gt;
    /// 分页拓展
    /// &lt;/summary&gt;
    /// &lt;param name=&quot;list&quot;&gt;集合对象&lt;/param&gt;
    /// &lt;param name=&quot;pageIndex&quot;&gt;当前页码，从1开始&lt;/param&gt;
    /// &lt;param name=&quot;pageSize&quot;&gt;页码容量&lt;/param&gt;
    /// &lt;returns&gt;&lt;/returns&gt;
    public static PageResult&lt;TEntity&gt; ToPagedList&lt;TEntity&gt;(this IEnumerable&lt;TEntity&gt; list, int pageIndex, int pageSize)
    {
        var total = list.Count();
        var items = list.Skip((pageIndex - 1) * pageSize).Take(pageSize).ToList();
        return CreatePagedList(items, total, pageIndex, pageSize);
    }

    /// &lt;summary&gt;
    /// 创建 &lt;see cref=&quot;PageResult{TEntity}&quot;/&gt; 对象
    /// &lt;/summary&gt;
    /// &lt;typeparam name=&quot;TEntity&quot;&gt;&lt;/typeparam&gt;
    /// &lt;param name=&quot;items&quot;&gt;分页内容的对象集合&lt;/param&gt;
    /// &lt;param name=&quot;total&quot;&gt;总条数&lt;/param&gt;
    /// &lt;param name=&quot;pageIndex&quot;&gt;当前页码，从1开始&lt;/param&gt;
    /// &lt;param name=&quot;pageSize&quot;&gt;页码容量&lt;/param&gt;
    /// &lt;returns&gt;&lt;/returns&gt;
    private static PageResult&lt;TEntity&gt; CreatePagedList&lt;TEntity&gt;(IEnumerable&lt;TEntity&gt; items, int total, int pageIndex, int pageSize)
    {
        var totalPages = pageSize &gt; 0 ? (int)Math.Ceiling(total / (double)pageSize) : 0;
        return new PageResult&lt;TEntity&gt;
        {
            Page = pageIndex,
            PageSize = pageSize,
            Items = items,
            Total = total,
            TotalPages = totalPages,
            HasNextPage = pageIndex &lt; totalPages,
            HasPrevPage = pageIndex - 1 &gt; 0
        };
    }
}

/// 用户接口实现
/// &lt;/summary&gt;
public class SysUserService : ISysUserService
{
    private readonly ISqlSugarClient db;
    private readonly IMapper mapper;

    /// &lt;summary&gt;
    /// 构造函数
    /// &lt;/summary&gt;
    /// &lt;param name=&quot;db&quot;&gt;&lt;/param&gt;
    /// &lt;param name=&quot;mapper&quot;&gt;&lt;/param&gt;
    public SysUserService(ISqlSugarClient db, IMapper mapper)
    {
        this.db = db;
        this.mapper = mapper;
    }

    /// &lt;inheritdoc/&gt;
    public async Task&lt;long&gt; Create([FromBody] SysUserCreateReqVO reqVO)
    {
        ValidateForCreate(reqVO.Username);
        var sysUser = mapper.Map&lt;SysUserDO&gt;(reqVO);
        return await db.Insertable(sysUser).ExecuteReturnBigIdentityAsync();
    }

    /// &lt;inheritdoc/&gt;
    public async Task Delete(long id)
    {
        // 校验自己存在
        if (db.Queryable&lt;SysUserDO&gt;().Where(s =&gt; s.Id == id).First() == null)
        {
            throw new Exception(&quot;数据不存在&quot;);
        }
        await db.Deleteable&lt;SysUserDO&gt;().Where(s =&gt; s.Id == id).ExecuteCommandAsync();
    }
    /// &lt;inheritdoc/&gt;

    public async Task&lt;SysUserRespVO&gt; Get(long id)
    {
        var sysUserDO = await db.Queryable&lt;SysUserDO&gt;().Where(s =&gt; s.Id == id).FirstAsync();
        return mapper.Map&lt;SysUserRespVO&gt;(sysUserDO);
    }
    /// &lt;inheritdoc/&gt;

    public async Task&lt;List&lt;SysUserRespVO&gt;&gt; List()
    {
        var doList = await db.Queryable&lt;SysUserDO&gt;().ToListAsync();
        return mapper.Map&lt;List&lt;SysUserRespVO&gt;&gt;(doList);
    }
    /// &lt;inheritdoc/&gt;

    public async Task&lt;List&lt;SysUserRespVO&gt;&gt; Page([FromQuery] SysUserPageReqVO param)
    {
        // 查询构造器
        var list = await db.Queryable&lt;SysUserDO&gt;()
            .Where(Expressionable.Create&lt;SysUserDO&gt;()
                .OrIF(!string.IsNullOrWhiteSpace(param.Username), o =&gt; o.Username.Contains(param.Username))
                .ToExpression()
            )
            .ToListAsync();
        return mapper.Map&lt;List&lt;SysUserRespVO&gt;&gt;(list);
    }
    /// &lt;inheritdoc/&gt;

    public async Task&lt;long&gt; Update([FromBody] SysUserUpdateReqVO reqVO)
    {
        ValidateForUpdate(reqVO.Id, reqVO.Username);
        var sysUser = mapper.Map&lt;SysUserDO&gt;(reqVO);
        await db.Updateable(sysUser)
            .UpdateColumns(it =&gt; new { it.Username, it.Nickname, it.Remark, it.UpdateTime })
            .ExecuteCommandAsync();
        return reqVO.Id;
    }

    private void ValidateForCreate(string name)
    {
        SysUserDO userDO = db.Queryable&lt;SysUserDO&gt;().Where(s =&gt; s.Username == name).First();
        if (userDO == null)
        {
            return;
        }
    }
    private void ValidateForUpdate(long id, string name)
    {
        // 校验自己存在
        if (db.Queryable&lt;SysUserDO&gt;().Where(s =&gt; s.Id == id).First() == null)
        {
            throw new Exception(&quot;数据不存在&quot;);
        }
        // 校验唯一性
        SysUserDO userDO = db.Queryable&lt;SysUserDO&gt;().Where(s =&gt; s.Username == name).First();
        if (userDO != null)
        {
            throw new Exception(&quot;数据重复&quot;);
        }
    }
}
