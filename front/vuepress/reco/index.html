<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>添加config.js的nav配置</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// .vuepress/config.js</span>

<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h2 id="评论"><a href="#评论" class="header-anchor">#</a> 评论</h2> <p>主题内置评论插件 <a href="https://vuepress-theme-reco.recoluan.com/views/plugins/" target="_blank" rel="noopener noreferrer">@vuepress-reco/vuepress-plugin-comments<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，可以根据自己的喜好选择 <code>Valine</code> 或者 <code>Vssue</code>；</p> <p>如果你想默认不加载评论，而只在某些页面显示评论功能，可以在 <code>valineConfig</code> 或 <code>vssueConfig</code> 中设置 <code>showComment: false</code>，并在需要展示评论的页面 设置 <code>isShowComments: true</code>。</p> <p>如果仅是某篇文章不想设置开启评论功能，可以在 <code>front-matter</code> 设置 <code>isShowComments: false</code>。</p> <p>浏览量</p> <ol><li><strong>浏览量</strong> 仅在使用 <code>Valine</code> 时显示；</li> <li>因为 <strong>浏览量</strong> 需要在页面加载时去调用相关接口，所以列表页的所有数据会一起加载下来，如果文章数量很多会影响加载速度，所以在 <code>1.2.0</code> 之后去掉文章列表的浏览量。</li></ol> <h2 id="加密"><a href="#加密" class="header-anchor">#</a> 加密</h2> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// .vuepress/config.js</span>

      color<span class="token operator">:</span> '#42b983'<span class="token punctuation">,</span> <span class="token comment">// 登录页动画球的颜色</span>
      lineColor<span class="token operator">:</span> '#42b983' <span class="token comment">// 登录页动画线的颜色</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><h2 id="config-js-配置"><a href="#config-js-配置" class="header-anchor">#</a> Config.js 配置</h2> <h3 id="移动端优化"><a href="#移动端优化" class="header-anchor">#</a> 移动端优化</h3> <p>在移动端，搜索框在获得焦点时会放大，并且在失去焦点后可以左右滚动，这可以通过设置元来优化。</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// .vuepress/config.js</span>

  theme<span class="token operator">:</span> 'reco'<span class="token punctuation">,</span>
  themeConfig<span class="token operator">:</span> <span class="token punctuation">{</span>
    type<span class="token operator">:</span> 'your vue component name'

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>如果你的首页风格并不希望显示 <code>navbar</code>，你可以在首页文件里设置 <code>front-matter</code>，<code>navbar: false</code></p> <h2 id="关闭404-腾讯公益"><a href="#关闭404-腾讯公益" class="header-anchor">#</a> 关闭404 腾讯公益</h2> <div class="language-json line-numbers-mode"><pre class="language-json"><code>module.exports = <span class="token punctuation">{</span>

  theme<span class="token operator">:</span> 'reco'<span class="token punctuation">,</span>

    mode<span class="token operator">:</span> 'dark'<span class="token punctuation">,</span> <span class="token comment">// 默认 auto，auto 跟随系统，dark 暗色模式，light 亮色模式</span>
    <span class="token comment">// modePicker: false // 默认 true，false 不显示模式调节按钮，true 则显示</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>  
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h2 id="多款代码主题"><a href="#多款代码主题" class="header-anchor">#</a> 多款代码主题</h2> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// .vuepress/config.js</span>

module.exports = <span class="token punctuation">{</span>
  theme<span class="token operator">:</span> 'reco'<span class="token punctuation">,</span>
  themeConfig<span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token comment">/**
     * support for
     * 'default'
     * 'funky'
     * 'okaidia'
     * 'solarizedlight'
     * 'tomorrow'

  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><h2 id="侧边栏"><a href="#侧边栏" class="header-anchor">#</a> 侧边栏</h2> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// .vuepress/config.js</span>

  themeConfig<span class="token operator">:</span> <span class="token punctuation">{</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h2 id="定制样式与脚本"><a href="#定制样式与脚本" class="header-anchor">#</a> 定制样式与脚本</h2> <h3 id="修改主题颜色"><a href="#修改主题颜色" class="header-anchor">#</a> 修改主题颜色</h3> <p>通过配置 <code>.vuepress/styles/palette.styl</code> 来快速修改主题的一些颜色属性。</p> <div class="language-stylus line-numbers-mode"><pre class="language-stylus"><code><span class="token comment">// 默认值</span>
<span class="token variable-declaration"><span class="token variable">$accentColor</span> <span class="token operator">=</span> <span class="token hexcode">#3eaf7c</span>                      <span class="token comment">// 主题颜色</span></span>
<span class="token variable-declaration"><span class="token variable">$textColor</span> <span class="token operator">=</span> <span class="token hexcode">#2c3e50</span>                        <span class="token comment">// 文本颜色</span></span>
<span class="token variable-declaration"><span class="token variable">$borderColor</span> <span class="token operator">=</span> <span class="token hexcode">#eaecef</span>                      <span class="token comment">// 边框线颜色</span></span>
<span class="token variable-declaration"><span class="token variable">$codeBgColor</span> <span class="token operator">=</span> <span class="token hexcode">#282c34</span>                      <span class="token comment">// 代码块背景色</span></span>
<span class="token variable-declaration"><span class="token variable">$backgroundColor</span> <span class="token operator">=</span> <span class="token hexcode">#ffffff</span>                  <span class="token comment">// 悬浮块背景色</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="添加或修改主题样式"><a href="#添加或修改主题样式" class="header-anchor">#</a> 添加或修改主题样式</h3> <p>可以创建一个 <code>.vuepress/styles/index.styl</code> 文件以方便地添加额外样式。这是一个 Stylus 文件，也可以使用正常的 CSS 语法。</p> <div class="language-stylus line-numbers-mode"><pre class="language-stylus"><code><span class="token selector">.content <span class="token punctuation">{</span></span>
  <span class="token property-declaration"><span class="token property">font-size</span> <span class="token number">30</span><span class="token unit">px</span></span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h2 id="在-head-中引用脚本与样式"><a href="#在-head-中引用脚本与样式" class="header-anchor">#</a> 在 Head 中引用脚本与样式</h2> <p>通过配置 <code>.vuepress/config.js</code> 中的 <code>head</code> 来引入脚本与样式，它将会被编译为 <code>&lt;head&gt;</code> 中的一项。</p> <p>修改标题图标，增加鼠标单击特效与看板娘</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code>\\.vuepress/config/head.js

module.exports =  <span class="token punctuation">[</span>
  <span class="token punctuation">[</span>'link'<span class="token punctuation">,</span> <span class="token punctuation">{</span> rel<span class="token operator">:</span> 'icon'<span class="token punctuation">,</span> type<span class="token operator">:</span> <span class="token string">&quot;image/x-icon&quot;</span><span class="token punctuation">,</span> href<span class="token operator">:</span> '/images/favicon.ico' <span class="token punctuation">}</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
  <span class="token punctuation">[</span><span class="token string">&quot;meta&quot;</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> <span class="token property">&quot;name&quot;</span><span class="token operator">:</span> <span class="token string">&quot;viewport&quot;</span><span class="token punctuation">,</span> <span class="token property">&quot;content&quot;</span><span class="token operator">:</span> <span class="token string">&quot;width=device-width,initial-scale=1,user-scalable=no&quot;</span> <span class="token punctuation">}</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
  <span class="token punctuation">[</span><span class="token string">&quot;script&quot;</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> src<span class="token operator">:</span> <span class="token string">&quot;/js/bodyClick.js&quot;</span> <span class="token punctuation">}</span><span class="token punctuation">]</span><span class="token punctuation">,</span>
  <span class="token comment">// 看板娘</span>
  <span class="token punctuation">[</span><span class="token string">&quot;script&quot;</span><span class="token punctuation">,</span> <span class="token punctuation">{</span> src<span class="token operator">:</span> <span class="token string">&quot;/js/autoload.js&quot;</span> <span class="token punctuation">}</span><span class="token punctuation">]</span>
<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>引入head.js</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// .vuepress/config.js</span>
