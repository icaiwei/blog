必达法则是在一定条件下通过分子分母分别求导再求极限来确定未定式值的方法，即
$$
\lim_{x \to x_0} \frac{f(x)}{g(x)} =\lim_{x \to x_0}\frac {f'(x)}{g'(x)}
$$
当然这里的 <span class="vuepress-eq"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">x_{0}</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.58056em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathdefault">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.30110799999999993em;"><span style="top:-2.5500000000000003em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">0</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> 可以为 <span class="vuepress-eq"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>±</mo><mi mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">\pm\infty</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.66666em;vertical-align:-0.08333em;"></span><span class="mord">±</span><span class="mord">∞</span></span></span></span></span></p> <h2 id="切比雪夫综合法"><a href="#切比雪夫综合法" class="header-anchor">#</a> 切比雪夫综合法</h2> <p>切比雪夫综合法是一种常用的天线阵列波束图设计方法，它可以产生具有特定形状和旁瓣电平的波束图。</p> <h3 id="特点"><a href="#特点" class="header-anchor">#</a> 特点</h3> <p>每个副瓣电平是相等的；在相同副瓣电平和相同阵列长度下主瓣最窄；单元激励的分布公式如下所示
$$
I_n=\sum_{q=n}^{M}(-1)^{M-q}\frac{x_0^{2q-1}(q+M-2)!(2M-1)}{(q-n)!(q+n-1)!(M-q)!},n=1,2,…,M<br>
$$</p> <h3 id="切比雪夫多项式"><a href="#切比雪夫多项式" class="header-anchor">#</a> 切比雪夫多项式</h3> <p>切比雪夫综合法基于切比雪夫多项式，它是一类正交多项式，具有以下形式：
$$
T_n(x) = cos(n * arccos(x))
$$
其中，n 是多项式的阶数，x 是介于 -1 和 1 之间的自变量。</p> <h3 id="设计过程"><a href="#设计过程" class="header-anchor">#</a> 设计过程</h3> <p>波束图设计使用切比雪夫综合法设计天线阵列波束图的过程如下：</p> <p><strong>确定波束图形状：</strong>
首先，需要确定所需的波束图形状，例如主瓣宽度、旁瓣电平和旁瓣衰减率。</p> <p><strong>选择切比雪夫阶数：</strong>
根据所需的波束图形状，选择合适的切比雪夫阶数 n。</p> <p><strong>计算阵列权重：</strong>
使用切比雪夫多项式和波束图形状参数，计算天线阵列中每个辐射元件的权重。</p> <p><strong>阵列合成：</strong>
根据计算出的权重，合成天线阵列，形成所需的波束图。</p> <h2 id="泰勒阵列综合"><a href="#泰勒阵列综合" class="header-anchor">#</a> 泰勒阵列综合</h2> <h3 id="特点-2"><a href="#特点-2" class="header-anchor">#</a> 特点</h3> <p>靠近主瓣某个区域内的副瓣电平接近相等，随后单调地减小，有利于提高天线方向性。单元激励的分布公式如下所示：
$$
I(\zeta)=\frac{1}{L}[S_n(0)+2\sum_{m=1}^{\bar{n}-1}S_n(m)cos(\frac{2m\pi }{L}\zeta) ]
$$</p> <h2 id="归一化因子"><a href="#归一化因子" class="header-anchor">#</a> 归一化因子</h2> <p>归一化因子是一个数学概念，主要用于将数据转化为相对比较的表达形式。
将数据映射到特定的区间或范围中,使得数据具有可比性和可解释性。</p> <h2 id="馈电"><a href="#馈电" class="header-anchor">#</a> 馈电</h2> <p>馈电，供电的意思。指被控制装置向控制点的送电。</p> <h2 id="方向图-e-面-h-面"><a href="#方向图-e-面-h-面" class="header-anchor">#</a> 方向图 E 面，H 面</h2> <p>将方向图沿着 XOZ 面切开看去为 E 面方向图
<img src="/blog/assets/img/image-20240707-145.31fea3c2.png" alt="">
将方向图沿着 XOY 面切开看去为 H 面方向图
<img src="/blog/assets/img/image-20240707-146.63f2d62c.png" alt=""></p> <h2 id="增益-gain"><a href="#增益-gain" class="header-anchor">#</a> 增益（Gain）</h2> <p>在输入功率相等的条件下，实际天线与理想的辐射单元在空间同一点处所产生的信号的功率密度之比。
表示天线增益的参数有 dBd 和 dBi。
dBi 是相对于点源天线的增益，在各方向的辐射是均匀的；dBd 相对于对称阵子天线的增益 dBi=dBd+2.15。
相同的条件下，增益越高，电波传播的距离越远。</p> <p>实际应用中，即使集中某个方向，天线还是会在空间各个方向都有大小不同的增益，天线增益通常是指产生最大增益的方向上的增益，数学上用公式
$$
G=10lg\frac{P_2}{P_1}
$$
由此可见，天线增益其实表示的是将理想的辐射能量在空间某点上放大的效果。
可以这样来理解增益的物理含义： 在一定的距离上的某点处产生一定大小的信号，如果用理想的无方向性点源作为发射天线，需要100W 的输入功率，而用增益为 G = 13 dB = 20 的某定向天线作为发射天线时，输入功率只需100 / 20 = 5W 。</p> <p>简单说，天线增益就是指一个天线把输入的射频功率集中辐射的程度，显然，天线的增益与其方向图的关系很大，主瓣越窄、副瓣越小的天线其增益就越高，而不同结构的天线，其方向图的差别是很大的。
<img src="/blog/assets/img/image-20240707-148.fad59e4a.png" alt=""></p> <h2 id="主瓣宽度-副瓣电平"><a href="#主瓣宽度-副瓣电平" class="header-anchor">#</a> 主瓣宽度，副瓣电平</h2> <p>天线功率辐射击是否集中，可以用主瓣宽度这一参量来表示。
主瓣中辐射功率为最大值一半时两个矢径间的夹角称为主瓣宽度。主瓣宽度越小，方向图越尖锐，表示天线辐射越集中。</p> <p>副瓣的最大值相对主瓣最大值的比，称为副瓣电平，一般用分贝来表示，其定义为： <span class="vuepress-eq"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>10</mn><mi>l</mi><mi>g</mi><mfrac><mtext>副瓣最大值功率</mtext><mtext>主瓣最大值功率</mtext></mfrac></mrow><annotation encoding="application/x-tex">10lg\frac{副瓣最大值功率}{主瓣最大值功率}</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1.217331em;vertical-align:-0.345em;"></span><span class="mord">1</span><span class="mord">0</span><span class="mord mathdefault" style="margin-right:0.01968em;">l</span><span class="mord mathdefault" style="margin-right:0.03588em;">g</span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.872331em;"><span style="top:-2.6550000000000002em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord cjk_fallback mtight">主</span><span class="mord cjk_fallback mtight">瓣</span><span class="mord cjk_fallback mtight">最</span><span class="mord cjk_fallback mtight">大</span><span class="mord cjk_fallback mtight">值</span><span class="mord cjk_fallback mtight">功</span><span class="mord cjk_fallback mtight">率</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord cjk_fallback mtight">副</span><span class="mord cjk_fallback mtight">瓣</span><span class="mord cjk_fallback mtight">最</span><span class="mord cjk_fallback mtight">大</span><span class="mord cjk_fallback mtight">值</span><span class="mord cjk_fallback mtight">功</span><span class="mord cjk_fallback mtight">率</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span> ，相应功率之比为0.01,则副瓣电平为-20dB。在实际应用中，副瓣电平降低到-20dB以下对天线的影响就很小了。</p> <h2 id="谐振"><a href="#谐振" class="header-anchor">#</a> 谐振</h2> <p>谐振频率，也称为共振频率，是电路或系统中一个重要的概念。
当电路或系统受到外部激励时，如果外部激励的频率与系统的固有频率相同或非常接近，系统就会发生谐振，表现为振幅急剧增大。</p> <p>天线一般在某一频率调谐，并在此谐振频率为中心的一段频带上有效。但其它天线参数（尤其是辐射方向图和阻抗）随频率而变，所以天线的谐振频率可能仅与这些更重要参数的中心频率相近。
“谐振频率”和“电谐振”与天线的电长度相关。电长度通常是电线物理长度除以自由空间中波传输速度与电线中速度之比。天线的电长度通常由波长来表示。</p> <h2 id="行波-驻波-驻波比"><a href="#行波-驻波-驻波比" class="header-anchor">#</a> 行波，驻波，驻波比</h2> <p><strong>行波</strong>（traveling wave）就是一列波向前传输的过程，宏观肉眼可见的就比如水波，平静的水面你丢下一颗石子，水面就从中心振动向外扩展开来。很明显，因为水波的向外传播，用不了多久，整个池塘都会振动起来。
行波是可以传递能量的。
行波里有两个大的分类，横波和纵波，电磁波就是横波，地震波产生破坏力的主要是纵波，声波也是纵波，水波是纵横波。</p> <p><strong>驻波</strong>（standing wave）就是行波在前进过程中受到了阻挡，产生了反射，然后反射波和入射波叠加导致的。
入射波和反射波频率相同，振幅相同，当然它们的相位存在区别，不然就是相同波，而不是相干波了。
驻波因为叠加的缘故，在某些点处形成波节（nodes），振幅一直是零。
还有某些点形成波腹（antinodes), 其振幅绝对值一直是最大。</p> <p>驻波的能量无法定向传播。就像你看到水波在行波状态可以把东西（比如树叶）向前移动，但在驻波状态就只能把东西在原地上下振动。这是因为东西在原地的动能和势能相互转换，但不存在向前的能量。</p> <p>驻波是由行波在行进过程中受到阻挡而产生的，这种现象发生的非常频繁。
大部分情况下我们都拒绝这种现象，比如电路里如果匹配不好就会产生反射从而形成驻波，白白造成了传输能量的损失。但有时我们也会应用它，比如谐振腔体，就是通过驻波来增大特定频率的振幅。</p> <p><strong>驻波比</strong>全称为电压驻波比，又名 VSWR 和 SWR，为英文 Voltage Standing Wave Ratio 的简写。指传输线波腹电压与波谷电压幅度之比，又称为驻波系数、驻波比。
驻波比等于1时，表示馈线和天线的阻抗完全匹配，此时高频能量全部被天线辐射出去，没有能量的反射损耗；驻波比为无穷大时，表示全反射，能量完全没有辐射出去。
在入射波和反射波相位相同的地方，电压振幅相加为最大电压振幅 Vmax ，形成波腹；在入射波和反射波相位相反的地方电压振幅相减为最小电压振幅 Vmin ，形成波谷。
其它各点的振幅值则介于波腹与波谷之间。这种合成波称为行驻波。驻波比是驻波波腹处的电压幅值 Vmax 与波谷处的电压幅值 Vmin 之比。</p> <p>VSWR 越大，反射越大，匹配越差。
VSWR&gt;1，说明输进天线的功率有一部分被反射回来，从而降低了天线的辐射功率；
可见，不一定追求1.1以下的驻波比，一般1.5以下也足够了，96%的都发射出去了。</p> <h2 id="幅度加权-相位加权-密度加权"><a href="#幅度加权-相位加权-密度加权" class="header-anchor">#</a> 幅度加权，相位加权，密度加权</h2> <p>对于相控阵天线的辐射场，为了得到辐射方向图的低副瓣，常采用的方法有幅度加权，相位加权和密度加权等阵面加权。</p> <ol><li>幅度加权是通过控制每个单元的馈电幅度以实现相控阵天线辐射场的低副瓣。对采用幅度加权控制副瓣技术的研究已经出现了大量的解析方法和工程优化算法。然而，幅度加权使得相控阵天线的每个单元都要连接不同权值的衰减器，极大的增加了系统的成本和馈电的复杂度。并且，对于相控阵天线的散射场而言，能量来自于均匀平面波对阵列的照射，阵列的所有单元的散射场“激励”是相同的，所以对于阵列天线的散射问题无法采用幅度加权降低副瓣。</li> <li>相位加权是通过控制每个单元的馈电相位以实现相控阵天线辐射场的低副瓣。但是相位加权实现低副瓣的效果有限，仅靠相位加权很难获得更好的低副瓣性能指标。而且，相位加权也不能用于实现散射场的低副瓣。</li> <li>密度加权分为两种：
<ul><li>一种是等幅不等间距阵列，即阵中单元以中间单元对称，从阵中到阵列边缘的单元间距依次增大。然而，所得到的不规则辐射单元间距给阵面结构设计、散热设计，以及工艺加工等工程实施带来了很大的困难。</li> <li>另一种是等幅等间距稀疏阵，即按照一定的规律确定阵列栅格是否存在天线单元，从而形成相控阵天线的稀疏排布，以实现低副瓣的目的。这种稀疏阵与具有相同口径的满阵相比，几乎具有相同的主瓣宽度，而相对于单元数目的阵列具有更窄的主瓣和更高的分辨率，同时稀疏阵比满阵的造价更低，因而被很好的应用于大型相控阵天线中。</li></ul></li></ol> <h2 id="_3db波束宽度"><a href="#_3db波束宽度" class="header-anchor">#</a> 3dB波束宽度</h2> <p>半功率角，也称3dB 波束宽度、半功率波束宽度。
功率方向图中，在包含主瓣最大辐射方向的某一平面内，把相对最大辐射方向功率通量密度下降到一半处（或小于最大值3dB）的两点之间的夹角称为半功率波束宽度。
+3dB，表示功率增加为2倍；+10dB，表示功率增加为10倍。
-3dB，表示功率减小为1/2；-10dB，表示功率减小为1/10。</p> <h2 id="工作频率-工作带宽"><a href="#工作频率-工作带宽" class="header-anchor">#</a> 工作频率，工作带宽</h2> <p>天线的工作频率通常指的是其能够正常工作的频率范围，这个范围通常是由天线的结构、材料和电气特性所决定的。
天线的工作频率一般包括了其工作的中心频率和带宽范围，中心频率指的是天线在设计时所预期的主要工作频率，而带宽范围则指的是天线在其工作频率范围内的性能要求和特性。</p> <p>偏离中心频率时，天线的某些电特性将下降，在天线某个性能参数下降到容许值的频率范围。这个频率范围内的中心频率称为中心频率。</p> <h2 id="阻抗实部虚部"><a href="#阻抗实部虚部" class="header-anchor">#</a> 阻抗实部虚部</h2> <p>首先阻抗是一个矢量。
通常，阻抗是指器件或电路对流经它的给定频率的交流电流的抵抗能力。它用矢量平面上的复数表示。一个阻抗矢量包括实部（电阻 R）和虚部（电抗 X）。
阻抗在直角坐标系中用 Z=R+jX 表示。
在极坐标系中，阻抗可以用幅度和相角表示。
直角坐标系中的实部和虚部可以通过数学换算成极坐标系中的幅度和相位。
其次，要记住阻抗的单位是欧姆。另外，要思考一下我们所熟知的电阻（R）、电感(L)和电容（C）分别对应由于复阻抗平面中的位置。
<img src="/blog/assets/img/image-20240707-149.8c9fd0cf.png" alt=""></p> <h2 id="导纳"><a href="#导纳" class="header-anchor">#</a> 导纳</h2> <p>导纳是阻抗的倒数，它也可以可以表述为实部（G 电导）和虚部（电纳），其单位是西门子。
<img src="/blog/assets/img/image-20240707-150.24be7cfa.png" alt=""></p> <h2 id="品质因子-q-和损耗因子-d"><a href="#品质因子-q-和损耗因子-d" class="header-anchor">#</a> 品质因子 Q 和损耗因子 D</h2> <p>品质因子 Q 是衡量电抗（同时也是电纳）纯度的指标。换句话说，品质因子 Q 是表明器件接近纯电抗的程度，品质因子越大，说明电抗的绝对值越大，反过来说，也就是说明器件的电阻越小。</p> <p>实际上，器件阻抗中的实数部分，即电阻的大小表明能量在经过器件传输后，能量的损耗大小。因此，从上面的公式中可以看到，品质因子表明器件能量的损耗程度。</p> <p>品质因数(Q)是电抗纯度的度量(即与纯电抗，也就是与没有电阻的接近程度)，定义为元件中存储能量与该元件损耗能量之比。</p> <p>Q是无量纲单位，表达式为Q=X/R=B/G。您可从图6看到Q是q角的正切。</p> <p>Q 一般适用于电感器，对于电容器来说，表示纯度的这一项通常用耗散因素(D)表示。耗散因素是 Q 的倒数，它也是 q 补角的正切。</p> <p><img src="/blog/assets/img/image-20240707-151.8b774acf.png" alt=""></p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/07/07, 23:31:07</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/si/bps/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">最大传输速率与频率的关系</div></a> <a href="/blog/hardware/use/way/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">设计方法</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
