a）不均匀间距递变阵列：单元间距按照一定的系数递增；
b）稀布阵列：阵元间隔不是固定的，没有规律；
c）稀疏阵列：把均匀直线阵列按照一定的优化方法，抽取掉一部分单元；</li> <li>不均匀相位递变阵列：相位非均匀递变，如平方律分布等；</li> <li>不均匀激励幅度阵列：天线的激励幅度不相等，如切比雪夫分布，泰勒分布，正弦分布等；
其中，上述非规则线阵有如下优势：</li> <li>不均匀间距阵列：
a）不均匀间距递变阵列：同等阵元下，天线方向性系数更高；
b）稀布阵列：同等口径下，天线的副瓣更低，阵元数更少；
