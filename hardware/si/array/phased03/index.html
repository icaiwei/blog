5LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">直线阵列天线低副瓣综合<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>【转载】<a href="https://blog.csdn.net/qq_23176133/article/details/127865414?spm=1001.2014.3001.5502" target="_blank" rel="noopener noreferrer">相控阵天线（三）：直线阵列天线低副瓣综合（切比雪夫、泰勒分布、SinZ-Z和Villeneuve分布、含python代码）-CSDN博客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="阵列天线综合方法概述"><a href="#阵列天线综合方法概述" class="header-anchor">#</a> 阵列天线综合方法概述</h2> <p>直线阵列天线的综合是在预先给定辐射特性(如方向图形状、主瓣宽度、副瓣电平、方向性系数)的情况下，综合出阵列单元数、间距、激励幅度和相位。</p> <p>其中最常见的为给定方向图主瓣宽度、副瓣电平的要求进行综合，方向图的其它细节不苛求。这类综合方法最著名的是道尔夫—切比雪夫综合法，泰勒综合法、高斯分布、二项式分布、SinZ-Z 和 Villeneuve 分布等。
切比雪夫阵列的主要特点包括：等副瓣电平；在相同副瓣电平和相同阵列长度下主瓣最窄。泰勒阵列分布的特点是：靠近主瓣某个区域内的副瓣电平接近相等，随后单调地减小，有利于提高天线方向性。</p> <p>二项式分布是没有副瓣电平的，高斯分布比较接近与二项式分布，SinZ-Z 分布主副瓣电平比较高，其他副瓣电平较低，Villeneuve 分布的副瓣电平逐渐降低。</p> <p>泰勒分布的口径效率随着副瓣电平的降低而降低，切比雪夫的口径效率随着副瓣电平的降低先升高后降低，同时泰勒分布的口径效率与阵元数量关系不大，比较稳定，切比雪夫分布的口径效率与阵元数量有关。</p> <h2 id="切比雪夫阵列综合"><a href="#切比雪夫阵列综合" class="header-anchor">#</a> 切比雪夫阵列综合</h2> <p>切比雪夫阵列的主要特点包括：每个副瓣电平是相等的；在相同副瓣电平和相同阵列长度下主瓣最窄；单元激励的分布公式如下所示：
$$
I_n=\sum_{q=n}^{M}(-1)^{M-q}\frac{x_0^{2q-1}(q+M-2)!(2M-1)}{(q-n)!(q+n-1)!(M-q)!},n=1,2,…,M<br>
$$
32阵元的切比雪夫阵，副瓣电平分别为20、24、30、40dB，阵列的馈电分布如下所示：</p> <p><img src="/blog/assets/img/image-20240705-38.42b7d719.png" alt=""></p> <p>32阵元的切比雪夫阵，副瓣电平分别为20、24、30、40dB 对应的天线方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240705-39.899a57ee.png" alt=""></p> <h2 id="泰勒阵列综合"><a href="#泰勒阵列综合" class="header-anchor">#</a> 泰勒阵列综合</h2> <p>勒阵列分布的特点是：靠近主瓣某个区域内的副瓣电平接近相等，随后单调地减小，有利于提高天线方向性。单元激励的分布公式如下所示：
$$
I(\zeta)=\frac{1}{L}[S_n(0)+2\sum_{m=1}^{\bar{n}-1}S_n(m)cos(\frac{2m\pi }{L}\zeta) ]
$$

><img src="/blog/assets/img/image-20240705-51.be02d1ff.png" alt=""></p> <p>副瓣电平32dB，切比雪夫、泰勒和 Villeneuve 分布在不同阵元规模下的口径效率如下所示：</p> <p><img src="/blog/assets/img/image-20240705-52.9b0bf618.png" alt=""></p> <p><strong>泰勒分布的口径效率随着副瓣电平的降低而降低，切比雪夫的口径效率随着副瓣电平的降低先升高后降低，同时泰勒分布的口径效率与阵元数量关系不大，比较稳定，切比雪夫分布的口径效率与阵元数量有关。</strong></p> <h2 id="切比雪夫综合-python-代码示例"><a href="#切比雪夫综合-python-代码示例" class="header-anchor">#</a> 切比雪夫综合 python 代码示例</h2> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token keyword">import</span> math
