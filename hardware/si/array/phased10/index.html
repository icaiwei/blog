h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="简介"><a href="#简介" class="header-anchor">#</a> 简介</h2> <p>阵列天线的成本、批量和可制造性等实际问题的解决方案的选择直接影响阵列天线的性能。
对这些方面的考虑所导致的结果是：制造具有固定量化电平的功率分配网络和生产 3 位或 4 位（或更多位）数字移相器而不是连续可变移相器。
上述选择均会在阵列上产生周期性的幅度或相位误差，它们将产生大而明显的副瓣误差或栅瓣型波瓣误差，这些峰值叫做量化瓣。
同时不连续的移相器会形成不连续的波束跃度，并且可以通过使用虚位技术来获得更小的波束跃度</p> <h2 id="波束跃度"><a href="#波束跃度" class="header-anchor">#</a> 波束跃度</h2> <p>绝大多数的相控阵系统中都采用数字式移相器，移相器的移相量将以二进制方式改变，呈现不连续性。
若数字式移相器位数为 K，则移相器的最小移相量为:
$$
\varphi _{min}=\frac{2\pi}{2^k}
$$

就是，理论计算得到所需的的波束跃度所需的的移相器位数为 k，而实际采用 m 位移相器(m&lt;k),则 k-m 表示虚位。
这时实际的移相量为理论移相量的量化，常见的量化方式有四舍五入法。</p> <h3 id="不同虚位位数对指向精度的影响"><a href="#不同虚位位数对指向精度的影响" class="header-anchor">#</a> 不同虚位位数对指向精度的影响</h3> <p>一个12单元的直线阵列，不同虚位位数对指向精度的影响如下所示：</p> <p><img src="/blog/assets/img/image-20240707-65.939e2e4c.png" alt=""></p> <h3 id="不同虚位位数对副瓣电平的影响"><a href="#不同虚位位数对副瓣电平的影响" class="header-anchor">#</a> 不同虚位位数对副瓣电平的影响</h3> <p>一个12单元的直线阵列，不同虚位位数对副瓣电平的影响如下所示：</p> <p><img src="/blog/assets/img/image-20240707-66.e1b8a3b8.png" alt=""></p> <h2 id="幅度相位误差分析"><a href="#幅度相位误差分析" class="header-anchor">#</a> 幅度相位误差分析</h2> <p>在工程实际中阵列天线的各单元的馈电相位是不可能达到理想的馈电相位情况的，总存在相位误差。
当移相器、衰减器本身的移相、衰减特性不理想或存在单元随机相位、幅度误差时，此时的相位、幅度误差可看作是一个随机变量。</p> <h3 id="随机误差"><a href="#随机误差" class="header-anchor">#</a> 随机误差</h3> <p>当衰减器本身的衰减特性不理想、存在单元随机幅度误差或是阵元失效等因素的影响时，幅度误差可以看作是一个随机变量，满足一定的概率分布，因而每次随机实验得到的副瓣电平值也是不同的。远离波束峰值，并以波束峰值归一化的的平均副瓣电平如下所示：</p> <p><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANEAAABsCAIAAAB7DMATAAARDUlEQVR4Ae1dW08bRxSmD33sr8iP6FuVp1b9A+l73/rYqlIfixSlUlsRBaVqmjQEKhIVQsGhNFBECATVNIhLCJiWpImJHRsMKfiSBIc1u9MNnzg6mlmvl73Yppl9cGbPnnPmzHe+PTOzXpMWoQ+NQH0RaKlvd7o3jYDQnNMkqDcCmnP1Rlz3pzn3v+VAa3jH5ORkiDBpzoUIZnO5agnvaG1tDXFsmnMhgqldeUJAc84TTFopRAQ050IEU7vyhIDmnCeYtFKICGjOhQjmsXc1OTl58uRJ7D3C3TdwaDTnOBpvevvkwWE/Y4mUdppzbzrPaPyTk5NU2+y2TTs6JZ1QGppzocD4P3SiOfc/TGozDwl1LtyvH2i8UdU5FOrW1lbEbS9O+QDoWxkupJga2KBFtGMMtNBpaWmxVz5q8PZ4sQaPaFZyjCoKIRZ2UXgWIpr3SvjeB6tRXqh55rg8ohF6d8sDU60wKLqFMC5JjTwca85FSrhIOAfcT548Sfng2YKQcqOWCrJqSIMCk3pXBwWJyi1wUZVLDpv2FKU60vDCn1tV0LE44MOgQsiFzdCuxjkELDHJsdQ5ajbJ0OzROR4UHm1XocYLB+kEb9SDc0IIKXqVl8FHEooHG2tHJrkIJSJW4xyyWK2uU7+2ueQw+LjIOUYhffLupEtS1oJHAg/hcw6g26vsmvhWUwhrbD78UHq4raPw9brk4OA5cxTCHGRyNAFi2GbxrEueeUge26hb8IkAKDt2VDjqn4XwOcfH6Tgee6hAwSNwPtSoC55Cqe09NvImRQKHEjMkIWy5DhSohEgK1fqSuvZ4Sgzjg0UAXOLRW1hq4XPOnkndaSeB7nEkdjLoqImXHQApV2s49msrIzx+1VHoWNKwirA9EMlqeoNz0ie3PABAynVIgtFJyjilsCW4SO5oVQdhJJyzgaOBqZMs0iAhqA4V9ygwhQmfHahOqIZBJBQ2d+IoJHJIA+Gj82IIHT4claZUrigq3NUgU7VHG/DT0iKnmKKSIifnUTfkgELsj6odHxsNuGZH0IQtbxOhudua3jwqOIbnKAyLc4QSCIRTTkFELhERD6VxCeFJxaxaeISe7TAKAL3gHCbn1GGrN6gqqRYl5xlvE2oukBFL6F5XG2q05FmtDTCXTFyE/Fap5o3iJ9rBIck5MrhEEvuUq0mnUKvmjcAhb3VuhMk5FVx1eNWAQL5tfZgQNXnybCEpqFM2B87OIjRdPiUCwZzSz72pqzRcxVgkTT5A8ib1JRlWmxy5Z24CtzU5RxhyPzbOPELpUn1OQ+YcB4LKBs0UlANJDStizBdEJpCPc44U0IgCIHSq3jyInAZCQ1MHImUUieeGkiv0SLcTbhKJo0QUDJkjA4ndqRqJI9pqPFHA6O4zZM4RY4hGPH9053FMbWgo0/xu5sjyNuWbJ9J9kB6v0hf8fBRki+CRWok3pENp5rFJhlJVIxOMnT65B4lzOOUkc+QclWfcogQyN6TI69kIjXMYErGKsCN6qZdIBw0CBeNHMgCQxDk1B6FAZvfCD4qcnBMp7bGombMD5uZcgd43UQ1pmNwWWPEAABFFwiu9bWhf5d2RGu587plfalQ7NM7xAWCQHDJ+1aXNkaVkUGEjWHFJqgQubpv2Eh+jFKRUazkyVMBgAs5J5s18Gg n class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>ε</mi><mi>A</mi></msub></mrow><annotation encoding="application/x-tex">\varepsilon_A</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.58056em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathdefault">ε</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.32833099999999993em;"><span style="top:-2.5500000000000003em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathdefault mtight">A</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> 为效率，N 为阵列规模。
阵元间距 0.5λ，阵元数量 16，原始阵列为等幅同相馈电，每组阵列随机产生-40 到 40 度的相位误差的，产生 100 W 组样本，并计算每组的相位均方根误差对和阵列天线副瓣电平，并绘制误差线，点线是该相位均方根误差下的副瓣电平的平均值，竖线是副瓣电平的最大值和最小值，如下所示：</p> <p><img src="/blog/assets/img/image-20240707-68.d55f9093.png" alt=""></p> <h3 id="周期误差"><a href="#周期误差" class="header-anchor">#</a> 周期误差</h3> <p>阵列天线的成本、批量和可制造性等实际问题的解决方案的选择直接影响阵列天线的性能。
对这些方面的考虑所导致的结果是：制造具有固定量化电平的功率分配网络和生产 3 位或 4 位（或更多位）数字移相器而不是连续可变移相器，以及采用时间延迟单元对宽带相扫子阵馈电来代替每个天线单元使用一个时间延迟单元。
上述选择均会在阵列上产生周期性的幅度或相位误差，就像阵列是由具有个别特定量化状态的子阵所构成的一样，由于这些误差是高度相关的，它们将产生大而明显的副瓣误差或栅瓣型波瓣误差，这些峰值叫做量化瓣。</p> <p>阵元间距0.5λ，阵元数量24，不同衰减器位数对应的切比雪夫阵列激励分布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-69.e28b32dc.png" alt=""></p> <p>阵元间距0.5λ，阵元数量24，不同衰减器位数对应的切比雪夫阵列分布的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-70.deedffda.png" alt=""></p> <p>阵元间距0.5λ，阵元数量24，不同衰减器位数和不同移相器位数对应的切比雪夫阵列分布的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-71.99a3070f.png" alt=""></p> <h2 id="python-代码示例"><a href="#python-代码示例" class="header-anchor">#</a> Python 代码示例</h2> <p><strong>绘制随机误差对副瓣电平影响的误差线 python 代码如下所示：</strong></p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np
<span class="token keyword">from</span> Array_Pattern <span class="token keyword">import</span> Pattern
<span class="token keyword">import</span> sys
<span class="token keyword">import</span> matplotlib<span class="token punctuation">.</span>pyplot <span class="token keyword">as</span> plt


<span class="token comment"># 计算均方根误差</span>
<span class="token keyword">def</span> <span class="token function">get_rmse</span><span class="token punctuation">(</span>records_real<span class="token punctuation">,</span> records_predict<span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">if</span> <span class="token builtin">len</span><span class="token punctuation">(</span>records_real<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token builtin">len</span><span class="token punctuation">(</span>records_predict<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">return</span> np<span class="token punctuation">.</span>sqrt<span class="token punctuation">(</span><span class="token builtin">sum</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">(</span>x <span class="token operator">-</span> y<span class="token punctuation">)</span> <span class="token operator">**</span> <span class="token number">2</span> <span class="token keyword">for</span> x<span class="token punctuation">,</span> y <span class="token keyword">in</span> <span class="token builtin">zip</span><span class="token punctuation">(</span>records_real<span class="token punctuation">,</span> records_predict<span class="token punctuation">)</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token operator">/</span> <span class="token builtin">len</span><span class="token punctuation">(</span>records_real<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token keyword">else</span><span class="token punctuation">:</span>
        <span class="token keyword">return</span> <span class="token boolean">None</span>

f <span class="token operator">=</span> <span class="token number">1.5</span>  <span class="token comment"># 频率</span>
k <span class="token operator">=</span> <span class="token number">0.5</span>  <span class="token comment"># 间距系数</span>
n_cell <span class="token operator">=</span> <span class="token number">12</span>  <span class="token comment"># 阵元数量</span>
n_group <span class="token operator">=</span> <span class="token number">100000</span>  <span class="token comment"># 样本数</span>
low_limit <span class="token operator">=</span> <span class="token operator">-</span><span class="token number">20</span>  <span class="token comment"># 随机相位的下限</span>
high_limit <span class="token operator">=</span> <span class="token number">20</span>  <span class="token comment"># 随机相位的上限</span>

<span class="token comment"># 单元天线的方向图，全向方向图</span>
data_angle <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span><span class="token operator">-</span><span class="token number">180</span><span class="token punctuation">,</span> <span class="token number">181</span><span class="token punctuation">)</span> <span class="token operator">/</span> <span class="token number">2</span>
data_gain <span class="token operator">=</span> np<span class="token punctuation">.</span>ones<span class="token punctuation">(</span><span class="token number">361</span><span class="token punctuation">)</span>
<span class="token comment"># 阵列的位置和幅度，0.5λ间距，等幅度</span>
myposition <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span>n_cell<span class="token punctuation">)</span> <span class="token operator">*</span> <span class="token number">300</span> <span class="token operator">/</span> f <span class="token operator">*</span> k
mypower <span class="token operator">=</span> np<span class="token punctuation">.</span>ones<span class="token punctuation">(</span>n_cell<span class="token punctuation">)</span>
<span class="token comment"># 产生随机相位样本</span>
myphase_list <span class="token operator">=</span> np<span class="token punctuation">.</span>random<span class="token punctuation">.</span>uniform<span class="token punctuation">(</span>low_limit<span class="token punctuation">,</span> high_limit<span class="token punctuation">,</span> <span class="token punctuation">(</span>n_group<span class="token punctuation">,</span> n_cell<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># 产生零相位列表</span>
phase_real  <span class="token operator">=</span> np<span class="token punctuation">.</span>zeros<span class="token punctuation">(</span>n_cell<span class="token punctuation">)</span>
<span class="token comment"># 记录RMSE，角度误差，SSLL</span>
pattern_dict <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token string">'RMSE'</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token string">'Angle_Error'</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token string">'SSLL'</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">}</span>
<span class="token comment"># 记录最大角度误差和最大副瓣电平的相位</span>
sll_phase_list <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>
angle_phase_list <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>
angle_error <span class="token operator">=</span> <span class="token operator">-</span>sys<span class="token punctuation">.</span>maxsize
ssll <span class="token operator">=</span> <span class="token operator">-</span>sys<span class="token punctuation">.</span>maxsize
<span class="token comment"># 进行方向图综合并记录数据</span>
pattern <span class="token operator">=</span> Pattern<span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> i <span class="token keyword">in</span> <span class="token builtin">range</span> <span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">,</span>n_group<span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token comment"># 计算阵列方向图</span>
    array_pattern <span class="token operator">=</span> pattern<span class="token punctuation">.</span>pattern_main<span class="token punctuation">(</span>f<span class="token punctuation">,</span> n_cell<span class="token punctuation">,</span> myposition<span class="token punctuation">,</span> myphase_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">,</span> mypower<span class="token punctuation">,</span> data_angle<span class="token punctuation">,</span> data_gain<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span>
    myphase_temp <span class="token operator">=</span> np<span class="token punctuation">.</span>mean<span class="token punctuation">(</span>myphase_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span>
    phase_predict <span class="token operator">=</span> myphase_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token operator">-</span>myphase_temp
    <span class="token comment"># 计算阵列方向图的最大值和角度并记录相位</span>
    array_angle <span class="token operator">=</span> pattern<span class="token punctuation">.</span>Pattern_Max<span class="token punctuation">(</span>array_pattern<span class="token punctuation">,</span>data_angle<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token builtin">abs</span><span class="token punctuation">(</span>array_angle<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token operator">&gt;=</span> angle_error<span class="token punctuation">:</span>
        angle_phase_list<span class="token punctuation">.</span>append<span class="token punctuation">(</span>myphase_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span>tolist<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        angle_error <span class="token operator">=</span> <span class="token builtin">abs</span><span class="token punctuation">(</span>array_angle<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
    <span class="token comment"># 计算阵列方向图的副瓣电平并记录相位</span>
    array_ssll <span class="token operator">=</span> pattern<span class="token punctuation">.</span>Pattern_SSLL<span class="token punctuation">(</span>array_pattern<span class="token punctuation">,</span>data_angle<span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span>array_ssll<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">&gt;=</span> ssll<span class="token punctuation">)</span><span class="token punctuation">:</span>
        sll_phase_list<span class="token punctuation">.</span>append<span class="token punctuation">(</span>myphase_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span>tolist<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        ssll <span class="token operator">=</span> array_ssll<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span>
    <span class="token comment"># 计算相位的均方根误差</span>
    phase_rmse <span class="token operator">=</span> <span class="token builtin">int</span><span class="token punctuation">(</span>get_rmse<span class="token punctuation">(</span>phase_real<span class="token punctuation">,</span> phase_predict<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token comment"># 记录数据</span>
    pattern_dict<span class="token punctuation">[</span><span class="token string">'RMSE'</span><span class="token punctuation">]</span><span class="token punctuation">.</span>append<span class="token punctuation">(</span>phase_rmse<span class="token punctuation">)</span>
    pattern_dict<span class="token punctuation">[</span><span class="token string">'Angle_Error'</span><span class="token punctuation">]</span><span class="token punctuation">.</span>append<span class="token punctuation">(</span>array_angle<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
    pattern_dict<span class="token punctuation">[</span><span class="token string">'SSLL'</span><span class="token punctuation">]</span><span class="token punctuation">.</span>append<span class="token punctuation">(</span><span class="token builtin">round</span><span class="token punctuation">(</span>array_ssll<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># 归类数据</span>
rmse_min <span class="token operator">=</span> <span class="token builtin">min</span><span class="token punctuation">(</span>pattern_dict<span class="token punctuation">[</span><span class="token string">'RMSE'</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
rmse_max <span class="token operator">=</span> <span class="token builtin">max</span><span class="token punctuation">(</span>pattern_dict<span class="token punctuation">[</span><span class="token string">'RMSE'</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
rmse_list <span class="token operator">=</span> np<span class="token punctuation">.</span>arange<span class="token punctuation">(</span>rmse_min<span class="token punctuation">,</span> rmse_max<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">)</span>
ssll_list <span class="token operator">=</span><span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token keyword">for</span> i <span class="token keyword">in</span> <span class="token builtin">range</span><span class="token punctuation">(</span>rmse_max<span class="token operator">-</span>rmse_min<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">]</span>
<span class="token keyword">for</span> i <span class="token keyword">in</span> <span class="token builtin">range</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">,</span><span class="token builtin">len</span><span class="token punctuation">(</span>pattern_dict<span class="token punctuation">[</span><span class="token string">'RMSE'</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    ssll_list<span class="token punctuation">[</span>pattern_dict<span class="token punctuation">[</span><span class="token string">'RMSE'</span><span class="token punctuation">]</span><span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token operator">-</span>rmse_min<span class="token punctuation">]</span><span class="token punctuation">.</span>append<span class="token punctuation">(</span>pattern_dict<span class="token punctuation">[</span><span class="token string">'SSLL'</span><span class="token punctuation">]</span><span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span>
ssll_mean <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span>
ssll_min_list<span class="token operator">=</span><span class="token punctuation">[</span><span class="token punctuation">]</span>
ssll_max_list <span class="token operator">=</span><span class="token punctuation">[</span><span class="token punctuation">]</span>
<span class="token keyword">for</span> i <span class="token keyword">in</span> <span class="token builtin">range</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">,</span><span class="token builtin">len</span><span class="token punctuation">(</span>rmse_list<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    ssll_mean <span class="token punctuation">.</span>append<span class="token punctuation">(</span>np<span class="token punctuation">.</span>mean<span class="token punctuation">(</span>ssll_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    ssll_min_list<span class="token punctuation">.</span>append<span class="token punctuation">(</span>np<span class="token punctuation">.</span><span class="token builtin">min</span><span class="token punctuation">(</span>ssll_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    ssll_max_list<span class="token punctuation">.</span>append<span class="token punctuation">(</span>np<span class="token punctuation">.</span><span class="token builtin">max</span><span class="token punctuation">(</span>ssll_list<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token comment"># 绘制误差线</span>
x <span class="token operator">=</span> rmse_list
y <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span>ssll_mean<span class="token punctuation">)</span>
lower_error <span class="token operator">=</span> np<span class="token punctuation">.</span>array<span class="token punctuation">(</span>ssll_mean<span class="token punctuation">)</span><span class="token operator">-</span>np<span class="token punctuation">.</span>array<span class="token punctuation">(</span>ssll_min_list<span class="token punctuation">)</span>

asymmetric_error <span class="token operator">=</span> <span class="token punctuation">[</span>lower_error<span class="token punctuation">,</span> upper_error<span class="token punctuation">]</span>
fig <span class="token operator">=</span> plt<span class="token punctuation">.</span>figure<span class="token punctuation">(</span><span class="token punctuation">)</span>
plt<span class="token punctuation">.</span>errorbar<span class="token punctuation">(</span>x<span class="token punctuation">,</span> y<span class="token punctuation">,</span> yerr<span class="token operator">=</span>asymmetric_error<span class="token punctuation">,</span> fmt<span class="token operator">=</span><span class="token string">'-o'</span><span class="token punctuation">)</span>
