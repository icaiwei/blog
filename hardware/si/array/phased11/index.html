通过 T/R 组件中的数控移相器/延时器可以快速改变各天线单元之间的相位差，以实现波束扫描。
对于包含发射功能的相控阵系统，阵列有源驻波是一个非常重要的指标，其直接反映了发射状态下电磁波通过空间耦合反向进入阵元的功率大小，有源驻波越大标志反向耦合功率越大，此时将可能损坏后端的收发通道。</p> <h2 id="有源驻波概念和计算公式"><a href="#有源驻波概念和计算公式" class="header-anchor">#</a> 有源驻波概念和计算公式</h2> <p>互耦效应引起的有源驻波参数可以采用单元间耦合系数的散射矩阵法进行分析，它对任何形式的阵列单元结构都适用。具有 n 个阵元的阵列可以看成是 n 端口网络，设 n 个端口上进波和出波分别为 a1,a2…an 和 b1,b2·…bn,<br>

qanpyckJKSnp8O1aUREROxyiIqK4nK58LkQjuMkBoIg7q7rL126RJOYIAgURe/+elJWVlZZWVlRURG5wIXiarXalJQU8sc5UBQlD8bNzs7W1tZ2d3cXFRUJhcLJyUm1Wj0yMpKeni4QCKRS6cTEhFQqXa1PMA4DvGWWlpbIx20wBwCg0+nWtkdd6TaED/KokAAAEokkPj6eegoLx/HCwkLxcuBwOK2trRMTE/BW6OjoiImJycnJmZiYIHctsbGxXV1dK3VqNZ+hGKza+s9koihKBQM71el0/fcC+XKbIIiFhQW9Xk8zTC6XW54zo5WhJVkMNEE2J8li2Bzdab2yGGiCbE6SxbA5utN6ZTHQBNmcJIthc3Sn9cpioAmyOUkWw+boTuuVxUATZHOS/wUrgHOueXCROwAAAABJRU5ErkJggg==" alt=""></p> <h2 id="平面阵列天线的有源驻波"><a href="#平面阵列天线的有源驻波" class="header-anchor">#</a> 平面阵列天线的有源驻波</h2> <h3 id="平面阵列有源驻波计算公式"><a href="#平面阵列有源驻波计算公式" class="header-anchor">#</a> 平面阵列有源驻波计算公式</h3> <p>一个平 X 方向阵元数为 M、Y 方向阵元数为 N 的平面阵，第 mn 号阵元的有源反射系数如下所示：</p> <p><img src="/blog/assets/img/image-20240707-75.dd55b064.png" alt=""></p> <p>α为方位扫描指向角，β为俯仰扫描指向角，<span class="vuepress-eq"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>S</mi><mrow><mi>m</mi><mi>n</mi><mo separator="true">,</mo><mi>p</mi><mi>q</mi></mrow></msub></mrow><annotation encoding="application/x-tex">S_{mn,pq}</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.969438em;vertical-align:-0.286108em;"></span><span class="mord"><span class="mord mathdefault" style="margin-right:0.05764em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.15139200000000003em;"><span style="top:-2.5500000000000003em;margin-left:-0.05764em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathdefault mtight">m</span><span class="mord mathdefault mtight">n</span><span class="mpunct mtight">,</span><span class="mord mathdefault mtight">p</span><span class="mord mathdefault mtight" style="margin-right:0.03588em;">q</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.286108em;"><span></span></span></span></span></span></span></span></span></span></span> 表示非扫描状态下 mn 号阵元与 pq 号阵元的矢量电压耦合系数。
其有源驻波如下所示：</p> <p><img src="/blog/assets/img/image-20240707-76.3772bcd9.png" alt=""></p> <p>综上可以看出阵列的有源驻波同天线阵元之间的固有耦合系数以及波束指向角度均有直接的联系。</p> <h3 id="平面阵列有源驻波仿真示例"><a href="#平面阵列有源驻波仿真示例" class="header-anchor">#</a> 平面阵列有源驻波仿真示例</h3> <p>建立一个5X5的平面阵列如下所示：</p> <p><img src="/blog/assets/img/image-20240707-77.a4a03e8e.png" alt=""></p> <p>中间阵元 cen 与周围阵元的耦合系数和相位如下所示：</p> <p><img src="/blog/assets/img/image-20240707-78.b9b0c3d1.png" alt=""></p> <p>中间单元在不同扫描角度下的有源驻波如下所示：</p> <p><img src="/blog/assets/img/image-20240707-79.a9b0d053.png" alt=""></p> <h3 id="不同幅度加权下的有源驻波分析"><a href="#不同幅度加权下的有源驻波分析" class="header-anchor">#</a> 不同幅度加权下的有源驻波分析</h3> <p>对如上所示的5X5的平面阵列进行泰勒加权，加权的副瓣电平不同，得到的有源驻波也不相同，如下所示：</p> <p><img src="/blog/assets/img/image-20240707-80.03bee243.png" alt=""></p> <h3 id="不同耦合系数-隔离度的有源驻波分析"><a href="#不同耦合系数-隔离度的有源驻波分析" class="header-anchor">#</a> 不同耦合系数/隔离度的有源驻波分析</h3> <p>如上所示，5X5的平面阵列，中间9个阵元的隔离度/耦合系数较差，旁边16阵元的隔离度/耦合系数相较于中间9阵元要低-10dB。我们设置中间9阵元的隔离度在[-a，-a+10dB]范围内的随机数，旁边16阵元为[-a-10dB，-a]范围内的随机数，不同 a 值对应的有源驻波如下所示：</p> <p><img src="/blog/assets/img/image-20240707-81.92b652fd.png" alt=""></p> <p>如上所示，保持相邻单元的耦合系数/隔离度在[-25，-15]dB 间，平均隔离为-20dB 将会有较好的有源驻波。</p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/07/08, 00:07:51</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/si/array/phased10/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">波束跃度、虚位技术、幅度相位误差分析</div></a> <a href="/blog/hardware/si/array/phased12/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">天线校准技术仿真介绍之旋转矢量法</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
