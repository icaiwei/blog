按照边界形式可以进行以下划分：矩形、六边形(矩形切角形成)、圆形、椭圆形等。
矩形栅格、三角形栅格构成的平面阵，其外观可以是矩形、六边形、圆形等。
三角形栅格排列的平面阵在满足相同的天线指标情况下，三角形栅格排列的平面阵所需单元数少。
均匀分布的圆形平面阵和六边形阵列的副瓣电平会比平面矩形阵列降低。

32 x 32 阵元的三角栅格阵列如下所示：</p> <p><img src="/blog/assets/img/image-20240707-22.ad7bacad.png" alt=""></p> <p>32_32阵元的三角栅格阵列的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-23.953f2498.png" alt=""></p> <h2 id="六边形阵列"><a href="#六边形阵列" class="header-anchor">#</a> 六边形阵列</h2> <p>如果把矩形平面阵列切掉四个角形成六边形阵列，则两个主面的方向图副瓣电平会在原来的基础上降低，把32 x 32矩形阵列的四角切掉8阵元，形成如下所示阵列：</p> <p><img src="/blog/assets/img/image-20240707-24.07b821ab.png" alt=""></p> <p>六边形阵列对应的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-25.fdd3f91a.png" alt=""></p> <h2 id="圆形平面阵列"><a href="#圆形平面阵列" class="header-anchor">#</a> 圆形平面阵列</h2> <p>均匀分布的圆形平面阵，其两个主面的方向图副瓣电平为-17.6dB，比均匀分布的矩形阵列的副瓣电平降低4dB，一个直径40阵元的圆形平面阵列如下所示：</p> <p><img src="/blog/assets/img/image-20240707-26.d441b875.png" alt=""></p> <p>直径40阵元的圆形平面阵列对应的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-27.22fe72d6.png" alt=""></p> <h2 id="空心平面阵列"><a href="#空心平面阵列" class="header-anchor">#</a> 空心平面阵列</h2> <p>对平面阵列的中间阵元进行挖空处理，形成空心的平面阵列，用于摆放其他的器件或者阵列，但是挖空中间单元会造成阵列天线方向图的副瓣电平升高。
中间挖空的平面圆形阵列，阵列排布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-28.34bfef64.png" alt=""></p> <p>中间挖空的平面圆形阵列的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-29.1b8a96b9.png" alt=""></p> <p>中间挖空的平面矩形阵列，阵列排布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-30.6a31b011.png" alt=""></p> <p>空心平面矩形阵列的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-31.393c0df3.png" alt=""></p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/07/08, 00:07:51</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/si/array/phased06/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">直线阵列天线特殊综合方法</div></a> <a href="/blog/hardware/si/array/phased08/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">圆环阵列天线和球面阵列天线</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
