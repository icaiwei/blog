远场测量发展成熟，可直接测量方向图，但对条件要求较高，且没有发挥相控阵天线可配相扫描的特点，已不是发展的主流。
阵列天线的近场扫描技术也广泛用于相控阵，需要微波暗室和探头、夹具和机械运动装置等专用仪器，精度高但操作复杂。
80 年代以后旋转电矢量法(ＲEV) 、换相测量法和互耦校准等新方法得到快速发展，编码理论、快速算法的应用增加了可行性，近场扫描技术也得到改进，测量精度和效率大大提高。</p> <h2 id="换相法算法简介"><a href="#换相法算法简介" class="header-anchor">#</a> 换相法算法简介</h2> <p>20世纪80年代中期由俄罗斯科研机构提出，国内很多学者作了理论上的改进。与 REV 法不同，换相法校准每个移相状态下的激励值，通过一次遍历所有单元的所有移相状态，通过解测量矩阵方程求得激励的幅相值：</p> <p><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOsAAAAiCAIAAAAxj7n+AAALQklEQVR4Ae2Ze1BbVR7HSyDQ7vqoTqfVravb7dj1MVsddeu6OtuqW91Rd7W6uqujq7W7KpbttFMrtVagttBSDQX7AGojpYHyCCGkFAIL4aWBxEAIkJS0QELSvIW8eFxyH+fsJKcJSUAIO9PdCXN/f+SenHsev/M9n/u755y7BNJGKxDNCiyJZudp32kFIE0wDUF0K0ATHN3zR3tPE0wzEN0K0ARH9/zR3tME0wxEtwI0wdE9f7T3NME0A9GtAE1wdM8f7X2UE0xZOqu55deMW6sYobxTSpllvlwuv8NAXu85HpcVnf3OEdSLU9VY4Xdp5rVC2GPVS6q8TlcIe5C/QZXp5EIViHKC4ZhpQHrkyZ/ELNuULlHrRj1o/G6j5MR7H+RJBy0TCxVkgeVJVeYTyx9K7SGm62E2zffpG+OXxG/KkKnV6kt1ux9gxt2zXaCSF+zaeUY+PDrlNCjY7797rGPY7+90ZTq1UAWinWAIIak+/FsmY+VbleP+wVMm3t7kcqMvHvvzrsuVspb+7fbY2DVJTVMh7U+cf+WGmPiNx4YpCCld9qb4uHW7WuQnPvt6wPdKIC9lb0+XhlYJqb/4/gAAggcV+Av8Fnx3QelFQDD0SD6+Ny72l/9qQRGY0p3fncwzX39+IdZxOOmFDQmM5a9XYCGqY9VbVzGYjxxUeYF1sJ9PiF29JXFfltRXirJyP9pTeR3WDwgGCGGAj7A08hHdDRQOcTzoT3AjQdnepJ+6cCgxDHM6nRiGuVwup9PpcrkmJyedfrNYLDiOo6YMPkNNXb16Va1W2+12DAtVERWd73cxEAwx4T9XxzLRu5zUFO78RGD9H/BLar7ek/lt+VsrGAl/zB8JEdrTsmNtXNz9e6XeZ2qi7LWbYphr/lFt95XB2j/f/pU6kuU5oczY+KtEYcSxGgDg8XisVqvT6SQI77oGUeh2uy0Wi8vloqhrsth9hggLJtXhcExMTC+8TCZT8N3gIWIYZjAYrFZrcHmdTtfc3GwymTIyMhobG9va2jQaDYvFavaZSCRyu93ebQpF5ebmajQa5KFOp5NIJFeuXCktLQ3uIsL0oiAYOkteXc5IeDJb5xk4nbSv5jrEt5ly2mtSPq20YU1Ja2KZj2b0hyBJyPc/wPQvLrCL226PXfpi4Zi3DXIoLymlJbDemdlsUA7Rk/rw6q0XIgtMgJqsOrb73jVrH9v8bNqepNSDX35UrKAgbG5uzs3NFYlE7e3tFy5cQMClp6fzeDw+ny8UCnt7e0dHRxFMbW1tQqEw4EJeXp7Hc21rEcikKKq+vl4gEPT29nZ2dopEIoVCEQiu3iGSZGVlJWoQx3E2mx2oizI7OjpUKpXH48FxHABgsVg6OzutVmt7e7vNZgsuHEl6cRBMGU9tXsa46U+pGR/s/zcKdfMN3iNJeeKuO2axn9+9bb66EEKPIuujk/0kJDo/Xc+MW7dbHDLR5ODRx5mMVT76KOu5Lbcy4p/8yrsut9fs3XnOEOELInKCAZjUtZyLY6x4s9BLLXBUJm1+jHnbc2aCKigoCFAoFovlcjmEMD09PZBps9nKysrQwuCbb77p7++/cuUKUiCMYBSPeTze4OAgAMDpdE5OThIEYTKZBAJBQDSj0VheXj4yMiKXy6em sTgcjtHo3XgAANra2rKysrq7u8P6mvsvTfDc+tB3F6AAjuPBTKOabrf7st8mJycDzTkcjrEx31eeQJbvKGN8PLLvPf5aNMF+JehrdCpAExyd80Z77VeAJtivBH2NTgVogqNz3miv/QrQBPuVoK/RqQBNcHTOG+21XwGaYL8S9DU6FaAJjs55o732K0AT7FeCvkanAv8Bc0ZYVSxWeKwAAAAASUVORK5CYII=" alt=""></p> <p>获得每个状态下的通道激励，进而判别故障和计算远场方向图。Y 为接收复信号，A 为已知的通道传输系数，ε为误差向量，W 为待求换相步骤矩阵。但一般情况下系数矩阵 A 不满秩，需补充先验信息，增加了求解难度和复原误差。</p> <h2 id="换相法校准对方向图的影响"><a href="#换相法校准对方向图的影响" class="header-anchor">#</a> 换相法校准对方向图的影响</h2> <p>一个32阵元的阵列，期望幅度分布为30dB 副瓣电平的切比雪夫分布，期望相位分布为等相位分布，实际相位分布在[-50°,50°]间，时间幅度分布为切比分布加上[0dB，0.5dB]的随机误差，通过旋转矢量法校准得到的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-100.75fac02f.png" alt=""></p> <p>其中幅度校准如下所示：</p> <p><img src="/blog/assets/img/image-20240707-101.6440c41c.png" alt=""></p> <p>其中相位校准如下所示：</p> <p><img src="/blog/assets/img/image-20240707-102.c139cf4c.png" alt=""></p> <h2 id="hadamard-控制矩阵的换相法仿真"><a href="#hadamard-控制矩阵的换相法仿真" class="header-anchor">#</a> Hadamard 控制矩阵的换相法仿真</h2> <p>一个 32 阵元的阵列，幅度分布为[0.25 dB，1 dB]间，相位分布为[-60°,60°]，考虑到实际移相器和衰减器存在一定的误差，给每个阵元增加 0.1 dB 的随机幅度误差，5 度的随机相位差，同时考虑矢量网络分析仪测试的时候，存在误差，设置最终的信号强度的 SNR 为 20dB。
hadamard 控制矩阵如下所示：</p> <p><img src="/blog/assets/img/image-20240707-103.a1a4ceff.png" alt=""></p> <p>控阵相控阵天线换相布阵的矩阵为 hadamard 矩阵，其中幅度仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-104.fa7a2c8c.png" alt=""></p> <p>相位仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-105.c5322145.png" alt=""></p> <h2 id="循环移相控制矩阵的换相法仿真"><a href="#循环移相控制矩阵的换相法仿真" class="header-anchor">#</a> 循环移相控制矩阵的换相法仿真</h2> <p>一个 32 阵元的阵列，幅度分布为[0.25 dB，1 dB]间，相位分布为[-60°,60°]，考虑到实际移相器和衰减器存在一定的误差，给每个阵元增加 0.1 dB 的随机幅度误差，5 度的随机相位差，同时考虑矢量网络分析仪测试的时候，存在误差，设置最终的信号强度的 SNR 为 20dB。
循环移动相的控制矩阵如下所示：</p> <p><img src="/blog/assets/img/image-20240707-106.f34b9c6b.png" alt=""></p> <p>控阵相控阵天线换相布阵的矩阵为循环移相矩阵，其中幅度仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-107.b86edcc4.png" alt=""></p> <p>相位仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-108.47e21c50.png" alt=""></p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/07/08, 00:07:51</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/si/array/phased12/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">天线校准技术仿真介绍之旋转矢量法</div></a> <a href="/blog/hardware/si/array/phased14/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">常规大阵列天线分布</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
