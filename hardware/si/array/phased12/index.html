现阶段常用的天线校准方法有 FFT 法、矩阵求逆法、近场扫描法、旋转矢量法、互耦校准法、换相法等。
近场扫描法操作简单，但忽略阵元间存在的互耦效应，因此难以精确的修正通道间的幅相误差。
换相法通过引入 Wals 函数、Hadamard 矩阵等生成特殊的实验步骤控制矩阵，一次测量即可校准所有单元。
旋转矢量法在探头位置、测量单元个数等方面选择灵活，但完成一次校准所需时间较长，计算量大，而且大型天线阵面中单个阵元相位的变化很难引起测试信号的明显变化。
各个校准方法的的特点如下所示：</p> <table><thead><tr><th>方法</th> <th>场地</th> <th>效率</th></tr></thead> <tbody><tr><td><strong>近场扫描法</strong></td> <td>近场</td> <td>逐个单元测量</td></tr> <tr><td><strong>矢量旋转法</strong></td> <td>近场、远场、天线口径面</td> <td>逐个单元，多个单元测量</td></tr> <tr><td><strong>换相法</strong></td> <td>近场、远场</td> <td>多个单元测量</td></tr> <tr><td><strong>互耦法</strong></td> <td>机内</td> <td>逐个单元测量</td></tr> <tr><td><strong>中场法</strong></td> <td>中场</td> <td>逐个单元，多个单元测量</td></tr></tbody></table> <h2 id="旋转矢量法算法介绍"><a href="#旋转矢量法算法介绍" class="header-anchor">#</a> 旋转矢量法算法介绍</h2> <p>旋转矢量法(REV 法)一般是应用在远场环境下，通过探测天线向相控阵天线发射信号，然后相控阵天线逐个单元进行旋转相位的操作，通过合成信号最大最小的幅值差和移相角计算出各个单元通道的幅度相位差值来校准和补偿天线的。
旋转矢量法对设备要求不高，易于实现，而且仅需要测量幅度值就可以完成校准，是比较常用的校准方法。</p> <p>旋转矢量法校准是改变某一单元的相位，根据探头所接收到的信号的变化与相位的关系可以求得该单元的幅相信息的过程，此方法探头无需移动，操作简单，但操作时间较长。旋转矢量法方法原理如下所示：</p> <p><img src="/blog/assets/img/image-20240707-82.71cfcdb2.png" alt=""></p> <p>探头所接收信号最大值与最小值为：</p> <p><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS4AAABcCAIAAABfv89qAAAgAElEQVR4Ae1deVwTZ/7miu62q+uiu6t1rZ9qi12PRaXFq2rx1nogVq0WrYqoVBSFapXaKCoCVkAOuQQ5PRA5BDksNwiKIAQIV4VAKFdYSAIEkzAzmd8nCQmTkEBmmFG2v3n/yZt33nnf7/N83+e9ZpJXCyYDyQDJwChgQGsU2ECaQDJAMgCTUiQbAcnAqGCAlOKocANpBMkAKUWyDZAMjAoGSCmOCjeQRpAMkFIk2wDJwKhggJTiqHADaQTJAClFsg2QDIwKBkgpjgo3kEaQDJBSJNsAycCoYICU4qhwA2kEyQApRbINkAyMCgZIKY4KN5BGkAyQUsS3DfC5XAGiRLDWz+56IYBIGf3RPwAENSQjkfFrksKiXrZByKyYvAW1vCxggPJiBHXpoQ/y2xXKlV8cMkJKcUh6UF4EKgMOHw0auAmsubHPLhOpzYFrozT2B4CghlkpshrxVag1xs4mlKmkF0zeEr44ZzjHNhfpY16eo9X1wt7CXjWGqEkmpaiGGEzJEL+DxZGNgfzG5xHHVn51vbhjoM/EVOpbvekPAEENXwPIelKPL7OI5ynkG95bUMNtqleloi+hjqgzmxd9OHVfNAdRGsT02LLebb1bjWJmRA5V0ZFIEWovS0uIVx0SkgqbURmiyji80vivE27dSkGURojlPXUxx+bOtEoTd5A9Rd6H91M9bHba3L5o8pl9vhBROS5RQhDAaCGAzGQvz/jXKLv/oQkgHhkvZt+0jf6sATM08xZY63bCsVTW0UruBis97NxLi6hGEzf4NiLGWGGe3RzjOcYOZQq5BypUGRuJFGGAx6IHmE3W1dKbtee6f0BAgL+vt7vjD7sXTNSl/OdCERo7VBqHRyLUmnzB3Dqsmq9QGCGW9yZaLjgQx4OhjseHjbYH1pc77Tv3jH1vx6T1fu0KtePxhRAEMHoIPSXe+7efTWjCr98lFhkMAzTqwqkHE2QNYnhv9TbSnuXm5uZEnd5lFZ6dm5v7rKRBMqTy0qjnIlkQ1OC9Vv8zpO6gBreVE1ZO2BbKReHqEUkRhmFBsuVUXT0D22fIfp+beHSFtWR0QGEJIVl78i+uWHYmp0dF4bhbLsyyMdoZwYYhptfaD799xC6/Zn4+j5v2/ScLziemhgZGhEa/6ET0nCpMQpmEOwJYPYSf1O89QZ3JVkaL7XPQNLthkBKHDIZhYf4P/552OKl/dTfYW8pQIU5ZYkRYWFio+3cbv3EOCQsLi0igdUIw1Hjnhyv5kmI6H+754BPrDJm6Yaj11ppxa8ah64JHKEWg5GdDiu5UiyS5FWKSwdrwwGRVzX8YD+B9uTvLdu4UszDFbbL+SnC3HCg4//lm/1YIFqQem7nUqYJ21dw+rz501+JDQZ77LSI6QYa7+fEkHFnBHQGsFoJFrEoOZf6CWkO2/3OWddqQYoTYjNJazfoiApGJ92yaPFdN+vpe/1JR2VvqoSpNUIUvr9n6ybZO+VknDSbvftDRzwhY7bR02tJpFk8UZCGjS83nyKQI1jgvGaPzt533h3SCmqqJTgYrXZa9r7/rPnJBLa8Td8sB+uWlJq5i10DtsZaLTG0PbzT7kXr8THBZe5T5cnFPy39iucIuFzl7kFuDJYI7Alg9BB6PEUWl3suJc7BySFHFJ+fBLv33ljhVDDFN7Y3c9XfT <a href="#旋转矢量法校准对方向图的影响" class="header-anchor">#</a> 旋转矢量法校准对方向图的影响</h2> <p>一个32阵元的阵列，期望幅度分布为30dB 副瓣电平的切比雪夫分布，期望相位分布为等相位分布，实际相位分布在[-50°,50°]间，时间幅度分布为切比分布加上[0dB，0.5dB]的随机误差，通过旋转矢量法校准得到的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-88.aee2b6a9.png" alt=""></p> <p>校准得到的幅度分布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-89.2ace46fd.png" alt=""></p> <p>校准得到的相位分布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-90.0fa1769c.png" alt=""></p> <h2 id="旋转矢量法算法仿真"><a href="#旋转矢量法算法仿真" class="header-anchor">#</a> 旋转矢量法算法仿真</h2> <p>一个 32 阵元的阵列，幅度分布为[0.25 dB，1 dB]间，相位分布为[-60°,60°]，考虑到实际移相器和衰减器存在一定的误差，给每个阵元增加 0.1 dB 的随机幅度误差，5 度的随机相位差，同时考虑矢量网络分析仪测试的时候，存在误差，设置最终的信号强度的 SNR 为 20 dB，仿真结果如下所示：
其中幅度仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-91.a7ce294f.png" alt=""></p> <p>相位仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-92.53830ae2.png" alt=""></p> <h2 id="移相器位数对旋转矢量法的影响"><a href="#移相器位数对旋转矢量法的影响" class="header-anchor">#</a> 移相器位数对旋转矢量法的影响</h2> <p>目前的有源相控阵天线多数都采用数字移相器，数字移相器改变相位是不连续的，对于 M 位的数字移相器其移相状态共有 <span class="vuepress-eq"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>M</mi></msup></mrow><annotation encoding="application/x-tex">2^M</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.8413309999999999em;vertical-align:0em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8413309999999999em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathdefault mtight" style="margin-right:0.10903em;">M</span></span></span></span></span></span></span></span></span></span></span></span> 个，最小移相角是 <span class="vuepress-eq"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>π</mi><mi mathvariant="normal">/</mi><msup><mn>2</mn><mi>M</mi></msup></mrow><annotation encoding="application/x-tex">2\pi / 2^M</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:1.0913309999999998em;vertical-align:-0.25em;"></span><span class="mord">2</span><span class="mord mathdefault" style="margin-right:0.03588em;">π</span><span class="mord">/</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8413309999999999em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathdefault mtight" style="margin-right:0.10903em;">M</span></span></span></span></span></span></span></span></span></span></span></span>。所以为了使旋转矢量法可以用于实际工程测量中，就有必要引入快速傅里叶变换（FFT）来处理获得的离散数据，从而模拟移相器连续改变时对应总电场功率变化曲线。
而由于数字移相器存在量化误差，从而影响了校准精度。
不同移相器位数对幅度校准的影响如下所示：</p> <p><img src="/blog/assets/img/image-20240707-93.3a82e0a8.png" alt=""></p> <p>不同移相器位数对相位校准的影响如下所示：</p> <p><img src="/blog/assets/img/image-20240707-94.3bd99d26.png" alt=""></p> <h2 id="多通道旋转矢量法算法仿真"><a href="#多通道旋转矢量法算法仿真" class="header-anchor">#</a> 多通道旋转矢量法算法仿真</h2> <p>使用旋转矢量法在校准天线时仅旋转一个通道的相位值，相对于整体而言其幅度变化可能比较小，在使用频谱仪测量时会因为灵敏度不够导致错误的测量结果，所以如果将多组通道同时旋转相位将会增加幅度变化的大小，从而提高测量的灵敏度。
不同通道数对幅度校准的影响如下所示：</p> <p><img src="/blog/assets/img/image-20240707-95.5b5460a5.png" alt=""></p> <p>不同通道数对相位校准的影响如下所示：</p> <p><img src="/blog/assets/img/image-20240707-96.9e509060.png" alt=""></p> <h2 id="分区旋转矢量法算法仿真"><a href="#分区旋转矢量法算法仿真" class="header-anchor">#</a> 分区旋转矢量法算法仿真</h2> <p>当阵面较小时，单独改变某一单元的幅度或相位对天线波束宽度影响较小，但会影响天线的副瓣电平，使副瓣电平抬高。但当天线阵面规格较大时，单个阵元相位的变化很难引起测试信号的明显变化，两次探头所接收到的信号大小基本相同，根据测量数据反演出的天线远场也基本相同。因此应用旋转矢量法对大型天线阵面校准时，需对天线进行分区，使探头能准确的测量出合成信号的变化。
一个 64 阵元的阵列，幅度分布为[0.25 dB，1 dB]间，相位分布为[-60°,60°]，考虑到实际移相器和衰减器存在一定的误差，给每个阵元增加 0.05 dB 的随机幅度误差，5 度的随机相位差，SNR 为 30 dB，将阵列分为 4 个区域，先对每个区域的 16 阵元进行旋转矢量法校准，再对 4 个区域进行旋转矢量法校准，仿真结果如下所示：
其中幅度仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-97.916ea666.png" alt=""></p> <p>其中相位仿真如下所示：</p> <p><img src="/blog/assets/img/image-20240707-98.6c808cba.png" alt=""></p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/07/08, 00:07:51</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/si/array/phased11/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">阵列天线有源驻波分析</div></a> <a href="/blog/hardware/si/array/phased13/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">天线校准技术仿真介绍之换相法</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
