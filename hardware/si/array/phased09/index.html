可分离的平面阵方向图在两个主面内是满足预期副瓣电平的，而在其他剖面内的方向图副瓣电平非常低。
在各个剖面内的副瓣电平都相等或者接近的分布方式包括不可分离切比雪夫和圆口径泰勒分布等。</p> <h2 id="不可分离型分布"><a href="#不可分离型分布" class="header-anchor">#</a> 不可分离型分布</h2> <h3 id="不可分离型切比雪夫"><a href="#不可分离型切比雪夫" class="header-anchor">#</a> 不可分离型切比雪夫</h3> <p>采用不可分离型切比雪夫激励分布设计的矩形平面阵列，限制条件是矩形阵列的每行和每列的单元数相同，但不一定是方阵，因为两个正交方向的单元间距 xd 和 yd 可不一定相等。

这种阵列口径分布即使是矩形栅格构成的圆形阵，也是不能按行列分离的，属于不可分离型分布。
采用圆口径泰勒综合方法得到的圆口径分布能满足各个剖面都是低副瓣的要求。

><mo>=</mo><msub><mi>I</mi><mrow><mi>x</mi><mi>m</mi></mrow></msub><mo>×</mo><mi>I</mi><mrow><mi>y</mi><mi>n</mi></mrow></mrow><annotation encoding="application/x-tex">I_{mn}=I_{xm}\times I{yn}</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.83333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathdefault" style="margin-right:0.07847em;">I</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.151392em;"><span style="top:-2.5500000000000003em;margin-left:-0.07847em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathdefault mtight">m</span><span class="mord mathdefault mtight">n</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2777777777777778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2777777777777778em;"></span></span><span class="base"><span class="strut" style="height:0.83333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathdefault" style="margin-right:0.07847em;">I</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.151392em;"><span style="top:-2.5500000000000003em;margin-left:-0.07847em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathdefault mtight">x</span><span class="mord mathdefault mtight">m</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222222222222222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222222222222222em;"></span></span><span class="base"><span class="strut" style="height:0.8777699999999999em;vertical-align:-0.19444em;"></span><span class="mord mathdefault" style="margin-right:0.07847em;">I</span><span class="mord"><span class="mord mathdefault" style="margin-right:0.03588em;">y</span><span class="mord mathdefault">n</span></span></span></span></span></span>。其阵因子是两个正交排列的直线阵阵因子的乘积。
对这类阵列的综合，可按行、列排列的两个直线阵分别进行综合。
得到的平面阵方向图在两个主面内是满足预期副瓣电平的，而在其他剖面内，其方向图副瓣电平非常低。</p> <h3 id="可分离切比雪夫综合"><a href="#可分离切比雪夫综合" class="header-anchor">#</a> 可分离切比雪夫综合</h3> <p>对于可分离型切比雪夫平面阵，它所产生的方向图为两个正交排列的直线阵方向图的乘积。这种平面阵的设计是较简单的，只需要由两个主面方向图的指标(主瓣宽度、副瓣电平)，分别设计沿 x 和 y 轴两个方向排列的直线阵即可。
一个16 x16阵元的平面可分离的切比雪夫分布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-55.55480db3.png" alt=""></p> <p>对应的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-56.4d01b599.png" alt=""></p> <h3 id="可分离泰勒综合"><a href="#可分离泰勒综合" class="header-anchor">#</a> 可分离泰勒综合</h3> <p>对于可分离型泰勒平面阵，它所产生的方向图为两个正交排列的直线阵方向图的乘积。
一个16 x16阵元的平面可分离的泰勒分布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-57.7552081b.png" alt=""></p> <p>16 x16阵元的平面可分离的泰勒分布的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-58.274b3e12.png" alt=""></p> <h2 id="平面阵列配相抵消法"><a href="#平面阵列配相抵消法" class="header-anchor">#</a> 平面阵列配相抵消法</h2> <p>这种方法是对阵列若干个单元进行“0、π配相”使得阵列天线在副瓣方向上这些单元的辐射场相互抵消，从而实现降低副瓣电平的目的。<br>
一个16 x16的平面阵列，馈电激励均为1，相位分布如下所示（其中黄色为180度相位，蓝色为0度相位）：</p> <p><img src="/blog/assets/img/image-20240707-59.21b6aa0b.png" alt=""></p> <p>一个16 x16的平面阵列进行配相法综合得到的方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-60.f512ebbf.png" alt=""></p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/07/08, 00:07:51</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/si/array/phased08/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">圆环阵列天线和球面阵列天线</div></a> <a href="/blog/hardware/si/array/phased10/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">波束跃度、虚位技术、幅度相位误差分析</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
