xtdxk4SKH336LFxSmkqefwU5T8fhdSdQf9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">直线阵列天线特殊综合方法<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>【转载】<a href="https://blog.csdn.net/qq_23176133/article/details/128004614?spm=1001.2014.3001.5502" target="_blank" rel="noopener noreferrer">相控阵天线（六）：直线阵列天线特殊综合方法（变形泰勒综合法、贝利斯综合法、伍德沃德抽样法）_贝利斯 matlab-CSDN博客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="简介"><a href="#简介" class="header-anchor">#</a> 简介</h2> <p>阵列天线的综合问题是其分析的逆问题，即是在预先给定辐射特性(如方向图形状、副瓣电平等)的情况下，综合出阵列激励幅度和相位。
其中特殊综合主要包括：
左右副瓣电平不相同的变形泰勒综合方法；
差方向图的低副瓣综合方法-贝利斯综合法；
指定方向图函数逼近的综合法-伍德沃德-劳森抽样法；
低副瓣阵列的相位综合方法-配相法）</p> <h2 id="变形泰勒综合法"><a href="#变形泰勒综合法" class="header-anchor">#</a> 变形泰勒综合法</h2> <p>为了满足某些实际应用，希望方向图主瓣两边的副瓣电平不同。采用变形的泰勒方向图综合法就可实现这种情况，由于方向图的不对称将导致综合得到的激励分布也不对称，而且会引入激励相位分布，使得激励分布为复数。
变形泰勒分布的各个单元的激励分布公式如下所示：</p> <p><img src="/blog/assets/img/image-20240707.540b90e7.png" alt=""></p> <p><img src="/blog/assets/img/image-20240707-1.94e22dce.png" alt=""></p> <p>左右副瓣电平不对称的阵列激励分布如下所示：</p> <p><img src="/blog/assets/img/image-20240707-2.27229578.png" alt=""></p> <p>左右副瓣电平不对称的阵列方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240707-3.d477d870.png" alt=""></p> <h2 id="贝利斯综合法"><a href="#贝利斯综合法" class="header-anchor">#</a> 贝利斯综合法</h2> <p>切比雪夫综合法、泰勒综合法、全波正弦分布、均匀分布等都可实现差方向图，但是这些分布实现的差方向图副瓣高，且副瓣电平不可控制。有时希望差方向图的副瓣电平低（如小于-25dB），且副瓣电平可以控制，则可采用贝利斯综合方法。
