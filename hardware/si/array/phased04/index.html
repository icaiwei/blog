这类综合方法有内插法、多项式逼近法、伍德沃德—劳森综合法、智能优化计算方法等。其中遗传算法、粒子群算法和差分进化算法等在内的智能优化算法已广泛应用于天线和电路等电磁工程领域</p> <p>遗传算法（Genetic Algorithm，GA）是模拟生物在自然环境中的遗传和进化过程而形成的自适应全局优化搜索算法。它借鉴了达尔文的进化论和孟德尔的遗传学说，本质上是一种并行、高效、全局搜索的方法，它能在搜索过程中自动获取和积累有关搜索空间的知识，并自适应地控制搜索过程以求得最优解。</p> <p>差分进化算法（Differential Evolution，DE）最初的设想是用于解决切比雪夫多项式问题，后来发现差分进化算法也是解决复杂优化问题的有效技术。差分进化算法是基于群体智能理论的优化算法，是通过群体内个体间的合作与竞争产生的智能优化搜索。</p> <p>粒子群算法（Particle Swarm Optimization，PSO）通过模拟鸟群觅食过程中的迁徙和群聚行为而提出的一种基于群体智能的全局随机搜索算法。粒子群算法与其他进化算法一样，也是基于“种群”和“进化”的概念，通过个体间的协作与竞争，实现复杂空间最优解的搜索。</p> <p><strong>通过对不同迭代次数的仿真，可以发现，粒子群算法的收敛速度远快于遗传算法，但是比较容易陷入局部收敛；遗传算法在多次迭代的平均效果是比较稳定的，且迭代次数较多的情况下，遗传算法的综合效果要好一些；差分进化算法多次迭代的效果与粒子群算法相当，但代码和算法要简单容易操作一些。</strong></p> <h2 id="遗传算法波束赋形"><a href="#遗传算法波束赋形" class="header-anchor">#</a> 遗传算法波束赋形</h2> <p>遗传算法（Genetic Algorithm，GA）是模拟生物在自然环境中的遗传和进化过程而形成的自适应全局优化搜索算法。遗传算法操作：使用“适者生存”的原则，在潜在的解决方案种群中逐次产生一个近似最优的方案。在每一代中，根据个体在问题域中的适应度值和从自然遗传学中借鉴来的再造方法进行个体选择，产生一个新的近似解。这个过程导致种群中个体的进化，得到的新个体比原个体更能适应环境。</p> <p>对一个 24 阵元的天线阵列进行斜方波束综合，要求-20°到 30°的天线增益按照-1/6 dB 的斜率下降，同时其他角度的天线增益小于-10 dB，波束赋形的综合过程如下所示：</p> <p>遗传算法赋形波束变化如下所示：</p> <p><img src="/blog/assets/img/array5.2d64c93f.gif" alt=""></p> <p>遗传算法赋形波束对应的阵元馈电电流如下所示：</p> <p><img src="/blog/assets/img/array6.eaa21b72.gif" alt=""></p> <p>最终天线的赋形方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240705-55.eecfbe64.png" alt=""></p> <p>遗传算法综合过程中适应度变化曲线如下所示：</p> <p><img src="/blog/assets/img/image-20240705-56.a4affaae.png" alt=""></p> <h2 id="粒子群算法波束赋形"><a href="#粒子群算法波束赋形" class="header-anchor">#</a> 粒子群算法波束赋形</h2> <p>粒子群算法（Particle Swarm Optimization，PSO）是通过模拟鸟群觅食过程中的迁徙和群聚行为而提出的一种基于群体智能的全局随机搜索算法。粒子群算法与其他进化算法一样，也是基于“种群”和“进化”的概念，通过个体间的协作与竞争，实现复杂空间最优解的搜索。它将群体中的个体看成是在 D 维搜索空间中没有质量和体积的粒子，每个粒子以一定的速度在解空间运动，并向自身历史最佳位置 pbestpbest 和邻域历史最佳位置 gbestgbest 聚集，实现对候选解的进化。
对一个 24 阵元的天线阵列进行斜方波束综合，要求-20°到 30°的天线增益按照-1/6 dB 的斜率下降，同时其他角度的天线增益小于-10 dB，波束赋形的综合过程如下所示：
最终天线的赋形方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240705-57.d99fd4e5.png" alt=""></p> <p>粒子群算法综合过程中适应度变化曲线如下所示：</p> <p><img src="/blog/assets/img/image-20240705-58.bb978775.png" alt=""></p> <h2 id="差分进化算法波束赋形"><a href="#差分进化算法波束赋形" class="header-anchor">#</a> 差分进化算法波束赋形</h2> <p>差分进化算法（Differential Evolution，DE）最初的设想是用于解决切比雪夫多项式问题，后来发现差分进化算法也是解决复杂优化问题的有效技术。差分进化算法是基于群体智能理论的优化算法，是通过群体内个体间的合作与竞争产生的智能优化搜索。但相比于进化计算，差分进化算法保留了基于种群的全局搜索策略，采用实数编码、基于差分的简单变异操作和“一对一”的竞争生存策略，降低了进化计算的复杂性。同时，差分进化算法特有的记忆能力使它可以动态跟踪当前的搜索情况，以调整其搜索策略，它具有较强的全局收敛能力和稳健性，且不需要借助问题的特征信息，适用于求解一些利用常规的数学规划方法很难求解甚至无法求解的复杂优化问题。
对一个 24 阵元的天线阵列进行斜方波束综合，要求-20°到 30°的天线增益按照-1/6 dB 的斜率下降，同时其他角度的天线增益小于-10 dB，波束赋形的综合过程如下所示：
最终天线的赋形方向图如下所示：</p> <p><img src="/blog/assets/img/image-20240705-59.e4668a9e.png" alt=""></p> <p>差分进化算法综合过程中适应度变化曲线如下所示：</p> <p><img src="/blog/assets/img/image-20240705-60.bca8680a.png" alt=""></p> <h2 id="智能算法比较"><a href="#智能算法比较" class="header-anchor">#</a> 智能算法比较</h2> <p>运用遗传算法、粒子群算法和差分进化算法对同一个赋形波束进行30次综合，迭代次数分别为50、100、400次，三种算法的适应度如下所示：<br>
迭代次数50三种算法的适应度如下所示：</p> <p><img src="/blog/assets/img/image-20240705-61.5d63af10.png" alt=""></p> <p>迭代次数100三种算法的适应度如下所示：</p> <p><img src="/blog/assets/img/image-20240705-62.73cb5b6e.png" alt=""></p> <p>迭代次数400三种算法的适应度如下所示：</p> <p><img src="/blog/assets/img/image-20240705-63.5803a1fb.png" alt=""></p> <p><strong>综上所示，当迭代次数较少的时候，粒子群的效果较好，当迭代次数较多的时候，遗传算法的效果较好；同时，粒子群的种群适应度是收敛最明显的；遗传算法的多次运行的结果是最稳定的；差分进化算法多次迭代的效果与粒子群算法相当，但代码和算法要简单容易操作一些。</strong></p> <h2 id="遗传算法波束赋形代码示例"><a href="#遗传算法波束赋形代码示例" class="header-anchor">#</a> 遗传算法波束赋形代码示例</h2> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token keyword">import</span> numpy <span class="token keyword">as</span> np

precisions <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">]</span>  <span class="token comment"># 决策变量的编码精度</span>

FieldD <span class="token operator">=</span> ea<span class="token punctuation">.</span>crtfld<span class="token punctuation">(</span>Encoding<span class="token punctuation">,</span> varTypes<span class="token punctuation">,</span> ranges<span class="token punctuation">,</span> borders<span class="token punctuation">,</span> precisions<span class="token punctuation">,</span> codes<span class="token punctuation">,</span> scales<span class="token punctuation">)</span>  <span class="token comment"># 调用函数创建译码矩阵</span>
<span class="token triple-quoted-string string">&quot;&quot;&quot;=========================遗传算法参数设置========================&quot;&quot;&quot;</span>
NIND <span class="token operator">=</span> <span class="token number">40</span>  <span class="token comment"># 种群个体数目</span>
MAXGEN <span class="token operator">=</span> <span class="token number">20</span>  <span class="token comment"># 最大遗传代数</span>
maxormins <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span>  <span class="token comment"># 列表元素为1则表示对应的目标函数是最小化，元素为-1则表示对应的目标函数是最大化</span>
selectStyle <span class="token operator">=</span> <span class="token string">'rws'</span>  <span class="token comment"># 采用轮盘赌选择</span>
recStyle <span class="token operator">=</span> <span class="token string">'xovdp'</span>  <span class="token comment"># 采用两点交叉</span>
mutStyle <span class="token operator">=</span> <span class="token string">'mutbin'</span>  <span class="token comment"># 采用二进制染色体的变异算子</span>
pc <span class="token operator">=</span> <span class="token number">0.7</span>  <span class="token comment"># 交叉概率</span>
pm <span class="token operator">=</span> <span class="token number">0.8</span>  <span class="token comment"># 整条染色体的变异概率（每一位的变异概率=pm/染色体长度）</span>
Lind <span class="token operator">=</span> <span class="token builtin">int</span><span class="token punctuation">(</span>np<span class="token punctuation">.</span><span class="token builtin">sum</span><span class="token punctuation">(</span>FieldD<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span>  <span class="token comment"># 计算染色体长度</span>
obj_trace <span class="token operator">=</span> np<span class="token punctuation">.</span>zeros<span class="token punctuation">(</span><span class="token punctuation">(</span>MAXGEN<span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">)</span>  <span class="token comment"># 定义目标函数值记录器</span>
var_trace <span class="token operator">=</span> np<span class="token punctuation">.</span>zeros<span class="token punctuation">(</span><span class="token punctuation">(</span>MAXGEN<span class="token punctuation">,</span> Lind<span class="token punctuation">)</span><span class="token punctuation">)</span>  <span class="token comment"># 染色体记录器，记录历代最优个体的染色体</span>
<span class="token triple-quoted-string string">&quot;&quot;&quot;=========================开始遗传算法进化========================&quot;&quot;&quot;</span>
start_time <span class="token operator">=</span> time<span class="token punctuation">.</span>time<span class="token punctuation">(</span><span class="token punctuation">)</span>  <span class="token comment"># 开始计时</span>
Chrom <span class="token operator">=</span> ea<span class="token punctuation">.</span>crtpc<span class="token punctuation">(</span>Encoding<span class="token punctuation">,</span> NIND<span class="token punctuation">,</span> FieldD<span class="token punctuation">)</span>  <span class="token comment"># 生成种群染色体矩阵</span>
variable <span class="token operator">=</span> ea<span class="token punctuation">.</span>bs2real<span class="token punctuation">(</span>Chrom<span class="token punctuation">,</span> FieldD<span class="token punctuation">)</span>  <span class="token comment"># 对初始种群进行解码</span>
ObjV <span class="token operator">=</span> aimfunc<span class="token punctuation">(</span>variable<span class="token punctuation">)</span>  <span class="token comment"># 计算初始种群个体的目标函数值</span>
FitnV <span class="token operator">=</span> ea<span class="token punctuation">.</span>ranking<span class="token punctuation">(</span>maxormins <span class="token operator">*</span> ObjV<span class="token punctuation">)</span>  <span class="token comment"># 根据目标函数大小分配适应度值</span>
best_ind <span class="token operator">=</span> np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>FitnV<span class="token punctuation">)</span>  <span class="token comment"># 计算当代最优个体的序号</span>
<span class="token comment"># 开始进化</span>
<span class="token keyword">for</span> gen <span class="token keyword">in</span> <span class="token builtin">range</span><span class="token punctuation">(</span>MAXGEN<span class="token punctuation">)</span><span class="token punctuation">:</span>
    SelCh <span class="token operator">=</span> Chrom<span class="token punctuation">[</span>ea<span class="token punctuation">.</span>selecting<span class="token punctuation">(</span>selectStyle<span class="token punctuation">,</span> FitnV<span class="token punctuation">,</span> NIND <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span>  <span class="token comment"># 选择</span>
    SelCh <span class="token operator">=</span> ea<span class="token punctuation">.</span>recombin<span class="token punctuation">(</span>recStyle<span class="token punctuation">,</span> SelCh<span class="token punctuation">,</span> pc<span class="token punctuation">)</span>  <span class="token comment"># 重组</span>
    SelCh <span class="token operator">=</span> ea<span class="token punctuation">.</span>mutate<span class="token punctuation">(</span>mutStyle<span class="token punctuation">,</span> Encoding<span class="token punctuation">,</span> SelCh<span class="token punctuation">,</span> pm<span class="token punctuation">)</span>  <span class="token comment"># 变异</span>
    <span class="token comment"># 把父代精英个体与子代的染色体进行合并，得到新一代种群</span>
    Chrom <span class="token operator">=</span> np<span class="token punctuation">.</span>vstack<span class="token punctuation">(</span><span class="token punctuation">[</span>Chrom<span class="token punctuation">[</span>best_ind<span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span><span class="token punctuation">,</span> SelCh<span class="token punctuation">]</span><span class="token punctuation">)</span>
    Phen <span class="token operator">=</span> ea<span class="token punctuation">.</span>bs2real<span class="token punctuation">(</span>Chrom<span class="token punctuation">,</span> FieldD<span class="token punctuation">)</span>  <span class="token comment"># 对种群进行解码(二进制转十进制)</span>
    ObjV <span class="token operator">=</span> aimfunc<span class="token punctuation">(</span>Phen<span class="token punctuation">)</span>  <span class="token comment"># 求种群个体的目标函数值</span>
    FitnV <span class="token operator">=</span> ea<span class="token punctuation">.</span>ranking<span class="token punctuation">(</span>maxormins <span class="token operator">*</span> ObjV<span class="token punctuation">)</span>  <span class="token comment"># 根据目标函数大小分配适应度值</span>
    <span class="token comment"># 记录</span>
    best_ind <span class="token operator">=</span> np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>FitnV<span class="token punctuation">)</span>  <span class="token comment"># 计算当代最优个体的序号</span>
    obj_trace<span class="token punctuation">[</span>gen<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">=</span> np<span class="token punctuation">.</span><span class="token builtin">sum</span><span class="token punctuation">(</span>ObjV<span class="token punctuation">)</span> <span class="token operator">/</span> ObjV<span class="token punctuation">.</span>shape<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span>  <span class="token comment"># 记录当代种群的目标函数均值</span>
    obj_trace<span class="token punctuation">[</span>gen<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">=</span> ObjV<span class="token punctuation">[</span>best_ind<span class="token punctuation">]</span>  <span class="token comment"># 记录当代种群最优个体目标函数值</span>
    var_trace<span class="token punctuation">[</span>gen<span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span> <span class="token operator">=</span> Chrom<span class="token punctuation">[</span>best_ind<span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span>  <span class="token comment"># 记录当代种群最优个体的染色体</span>
<span class="token comment"># 进化完成</span>
end_time <span class="token operator">=</span> time<span class="token punctuation">.</span>time<span class="token punctuation">(</span><span class="token punctuation">)</span>  <span class="token comment"># 结束计时</span>
ea<span class="token punctuation">.</span>trcplot<span class="token punctuation">(</span>obj_trace<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">[</span><span class="token string">'种群个体平均目标函数值'</span><span class="token punctuation">,</span> <span class="token string">'种群最优个体目标函数值'</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">)</span>  <span class="token comment"># 绘制图像</span>
<span class="token triple-quoted-string string">&quot;&quot;&quot;============================输出结果============================&quot;&quot;&quot;</span>
best_gen <span class="token operator">=</span> np<span class="token punctuation">.</span>argmax<span class="token punctuation">(</span>obj_trace<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'最优解的目标函数值：'</span><span class="token punctuation">,</span> obj_trace<span class="token punctuation">[</span>best_gen<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
variable <span class="token operator">=</span> ea<span class="token punctuation">.</span>bs2real<span class="token punctuation">(</span>var_trace<span class="token punctuation">[</span><span class="token punctuation">[</span>best_gen<span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token punctuation">:</span><span class="token punctuation">]</span><span class="token punctuation">,</span> FieldD<span class="token punctuation">)</span>  <span class="token comment"># 解码得到表现型（即对应的决策变量值）</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'最优解的决策变量值为：'</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> i <span class="token keyword">in</span> <span class="token builtin">range</span><span class="token punctuation">(</span>variable<span class="token punctuation">.</span>shape<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'x'</span> <span class="token operator">+</span> <span class="token builtin">str</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">'='</span><span class="token punctuation">,</span> variable<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">,</span> i<span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'用时：'</span><span class="token punctuation">,</span> end_time <span class="token operator">-</span> start_time<span class="token punctuation">,</span> <span class="token string">'秒'</span><span class="token punctuation">)</span>
