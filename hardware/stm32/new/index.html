vel2"><a href="/blog/hardware/stm32/new/#建立工程" class="sidebar-link">建立工程</a></li></ul></li><li><a href="/blog/hardware/stm32/gpio/" class="sidebar-link">GPIO工作原理</a></li><li><a href="/blog/hardware/stm32/led/bit/" class="sidebar-link">跑马灯-寄存器</a></li><li><a href="/blog/hardware/stm32/led/fun/" class="sidebar-link">跑马灯-寄存器</a></li><li><a href="/blog/hardware/stm32/beep/" class="sidebar-link">蜂鸣器</a></li><li><a href="/blog/hardware/stm32/key/" class="sidebar-link">按键</a></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Vivado</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>常见电路</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="articleInfo-wrap" data-v-06225672><div class="articleInfo" data-v-06225672><ul class="breadcrumbs" data-v-06225672><li data-v-06225672><a href="/blog/" title="首页" class="iconfont icon-home router-link-active" data-v-06225672></a></li> <li data-v-06225672><a href="/blog/categories/?category=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="分类" data-v-06225672>硬件知识</a></li><li data-v-06225672><a href="/blog/categories/?category=STM32" title="分类" data-v-06225672>STM32</a></li></ul> <div class="info" data-v-06225672><div title="作者" class="author iconfont icon-touxiang" data-v-06225672><a href="https://www.ic-sugar.com/blog" target="_blank" title="作者" class="beLink" data-v-06225672>i采薇</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-06225672><a href="javascript:;" data-v-06225672>2023-08-03</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAAXNSR0IArs4c6QAABKFJREFUSA3tVl1oFVcQnrMbrak3QUgkya1akpJYcrUtIqW1JvFBE9LiQ5v6JmJpolbMg32rVrhgoYK0QiMY6i9Y6EMaW5D+xFJaTYItIuK2Kr3+BJNwkxBj05sQY3b3nM6cs2dv9t7NT/vQJw/sndk5M/PNzJkzewGerP+pAmy+ON8lLzUJgA8ZYxYIYZmGYRnctDaWvJJAmTtfP1pvXsBCCPP8QFcCaRkZYACgDZFO4stNIcBCajEOlmmC9XpJ9bAGCaPaPmzPl32dvLSVu3BWCTQs0XQQ6g0DYgwLIoAZbBCdW/i+781o1VVlm/410mw4h06Y7bIPHNyWDyL4FHkX03Q8SrzNhZTZriieckWt7cL6MM85YcLpsi/7O9/iXFT6MswI0DmmpkSaJ0qLxFIm3+i1THHB3zmBH3PYx9CcykcLOeQVVa7QtdxTgQgEleX2AjHYfwA+2ddV77ruGoJUbhGDI09YSNXyMpUt5ylOzxgbUmtOp7NmbNt8v3arjTBfYELmLUV+M+nSawNNAUqpT3ClJWg5I3BLT+cGW/DXNGCa6tx1aakCGEigArTn4TDIPdrXXYKCZNrHLMCOEPvHBlLQ99s9eHB7EB6NTki73CVPQ2F5MSx/uRQixfmq7rK0wYD8w8E905bnPDfwoWs/rfv93NWN/ZfvwsLIU7A09gxECyISeGJkHAau98L97tuw7NXnoPyNF8FcYGLGKsOs0mN3OEyec9esGW/ZEl945dTP34wlR2FZVQWU1q0Cw8Tr7p+hgLLNL0FPxx/Q35mA8aEUrH6nCgwEl0tn7wUiZYJnNRh6DK4UH/k0lfyrsBKdPVv/AriGIQcEDQZ65LBAGe2Rzui9Ybjz7XUppz1/uKBbyVPGkN3ZAeC6hr0x7Nr38N5+EqkoOm17xpoqR9ohQF55ERSvr4Dkr3chNfC3DMzGJlNBElW8w9nsGQvhNGIzDkXzCg8cLK951xHsFBlTJspJNi3ZFIMF2AeDV3q8DNOB+YHi6QTrChDIWDBRi5U5f+ZMfJLu3ccrqxtdxk4SKH336LFxSmkqefwU5T8fhdSdQf9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">新建工程<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="库函数和寄存器"><a href="#库函数和寄存器" class="header-anchor">#</a> 库函数和寄存器</h2> <h3 id="区别"><a href="#区别" class="header-anchor">#</a> 区别</h3> <p>​	本质上是一样的。我们可以在库函数模板里面，直接操作寄存器，因为官方库相关头文件有寄存器定义。但是不能在寄存器模板调用库函数，因为没有引入库函数相关定义。
了解寄存器基本原理的目的是为了让我们对STM32相关知识有比较深入的理解，这样在开发过程中方可得心应手，游刃有余。底层代码配置出了问题需要调试的话，必须对寄存器有一定的了解才能找到问题，因为调试代码，底层只能查看寄存器相关配置。</p> <h2 id="工程结构"><a href="#工程结构" class="header-anchor">#</a> 工程结构</h2> <h3 id="文件夹"><a href="#文件夹" class="header-anchor">#</a> 文件夹</h3> <p>USER、CORE、FWLIB、SYSTEM、README</p> <h3 id="介绍"><a href="#介绍" class="header-anchor">#</a> 介绍</h3> <ol><li><p>“USER”:存放工程共用文件,延时函数、位操作</p></li> <li><p>“CORE”：存放工程的主函数main.c</p></li> <li><p>“FWLIB”：存放STM32 库文件</p></li> <li><p>“SYSTEM”:存放STM32 的启动文件、核心文件和一些头文件</p></li> <li><p>“README”:存放STM32 外设的驱动文件，如：led、key、lcd、ADC、DAC、PWM ……</p> <p><img src="/blog/assets/img/image-20220411220323321.43b0c9fc.png" alt="image-20220411220323321"></p></li></ol> <h2 id="固件库模板"><a href="#固件库模板" class="header-anchor">#</a> 固件库模板</h2> <h3 id="初始"><a href="#初始" class="header-anchor">#</a> 初始</h3> <p>环境：MDK5</p> <p>固件库版本：v1.4(F4专用)</p> <p>重要的预编译全局宏定义标识符：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>STM32F40_41xxx,USE_STDPERIPH_DRIVER
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动文件：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>startup_stm32f40_41xxx.s
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="常见错误"><a href="#常见错误" class="header-anchor">#</a> 常见错误</h3> <p><strong>&quot;no source&quot;: Error: command-line:  #992: invalid macro definition: STM32F40_41xxx.USE_STDPERIPH_DRIVER</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>答案：STM32F40_41xxx,USE_STDPERIPH_DRIVER 
    宏定义标识符错误。。。。输入要正确，逗号隔开
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p><strong>..\FWLIB\src\stm32f4xx_usart.c(1038): warning: 223-D: function &quot;assert_param&quot; declared implicitly</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>答案：宏定义标识符“USE_STDPERIPH_DRIVER”书写错误。
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>..\USER\stm32f4xx.h(102): error:  #35: error directive: &quot;Please select first the target STM32F4xx device used in your application (in stm32f4xx.h file)“</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>答案：宏定义标识符“STM32F40_41xxx”书写错误。
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>..\USER\stm32f4xx_conf.h(34): error:  #5: cannot open source input file &quot;stm32f4xx_adc.h&quot;: No such file or directory</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>头文件路径找不到。加入path的路径为inc子目录，不是src子目录。
或者压根头文件路径inc就没有加入到工程的path中。
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="固件包"><a href="#固件包" class="header-anchor">#</a> 固件包</h3> <p><img src="/blog/assets/img/image-20220411215800313.98add149.png" alt="image-20220411215800313"></p> <h2 id="寄存器模板"><a href="#寄存器模板" class="header-anchor">#</a> 寄存器模板</h2> <h3 id="启动文件修改"><a href="#启动文件修改" class="header-anchor">#</a> 启动文件修改</h3> <p><strong>startup_stm32f40_41xxx.s</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>; Reset handler
Reset_Handler    PROC
                 EXPORT  Reset_Handler             [WEAK]
;IMPORT  SystemInit	
;寄存器代码,不需要在这里调用SystemInit函数,故屏蔽掉,库函数版本代码,可以留下
;不过需要在外部实现SystemInit函数,否则会报错.
IMPORT  __main
    LDR     R0, =0xE000ED88    ; 使能浮点运算 CP10,CP11
    LDR     R1,[R0]
    ORR     R1,R1,#(0xF &lt;&lt; 20)
    STR     R1,[R0]

    ;LDR     R0, =SystemInit	;寄存器代码,未用到,屏蔽
    ;BLX     R0				;寄存器代码,未用到,屏蔽
    LDR     R0, =__main
    BX      R0
    ENDP

把第一步拷贝的基本文件对应的添加到工程</p> <p><img src="/blog/assets/img/image-20220411220847541.55339fa9.png" alt="image-20220411220847541"></p></li> <li><p>添加完文件后如下图所示</p> <p><img src="/blog/assets/img/image-20220411220902769.84815925.png" alt="image-20220411220902769"></p></li></ol></li> <li><p>编写用户代码</p> <ol><li><p>在“USER”,建立“LED”文件夹</p></li> <li><p>这步根据自己所需用到何种外设建立文件夹，这就是模块化编程</p> <p>建立用户代码 .c 和 .h 文件</p> <p>点击下图左上角第一个红色圈出来的，建立文件</p> <p>点击保存在USER 对应的文件夹中</p> <p>以下为.c 为例，.h 同理</p> <p>在建立的.c 中编写用户代码</p> <p><img src="/blog/assets/img/image-20220411221006839.30f81e7c.png" alt="image-20220411221006839"></p></li> <li><p>用户文件添加到工程</p> <p><img src="/blog/assets/img/image-20220411221054063.772a0454.png" alt="image-20220411221054063"></p></li></ol></li></ol></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=%E7%A1%AC%E4%BB%B6%E7%9F%A5%E8%AF%86" title="标签">#硬件知识</a></div> <div class="last-updated"><span class="prefix">更新时间:</span> <span class="time">2024/01/30, 21:06:17</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/hardware/stm32/path/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">环境安装与下载方式</div></a> <a href="/blog/hardware/stm32/gpio/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">GPIO工作原理</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
