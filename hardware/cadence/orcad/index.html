Capture CIS 中两个重要概念：instance 和 occurrences 用 OrCAD设计原理图必须理解两个概念 instance 和 occurrences。对于元件放置、替换、修改属性等很多操作都和这两个概念有关。</p> <p>假如你在自己的元件库中已经建立了一个元件 AD8056的运放。在原理图 page1 中需要放入两个 AD8056 构成双路模拟信号输入的运放，那么在放入第一个 AD8056 时，在工程管理框的 design cache 中会出现这个元件以及所在的元件库地址，原理图的 page1 上出现 AD8056 原理图符号。</p> <p>这时就产生了一个 instance 和一个 occurrences，你可以把 design cache 中的 AD8056 看成 instance，而原理图中的 AD8056 看成是一个 occurrences。当你放第二个 AD8056 时，原理图的 page1 上出现第二个 AD8056 原理图符号，产生了另一个 occurrences。也就是说，在原理图上放多少个 AD8056 就有多少个 occurrences，但因为这些元件都是同一个元件库中取出来的，其各方面的属性都相，都是同一种元件，所以 instance 只有一个。因此可以把 instance 理解为元件种类，occurrences 理解为个体实例。这里的种类指包括图形，属性等都相同的元件类型。</p> <p>如果图形相同，但属性不同，那么就不是同种元件，对应不同的 instance。理解这个概念最好的方法就是在原理图中修改 instance。选中原理图中一个 AD8056 occurrences，右键‐&gt;edit part 就可以修改该 occurrences 对应得 instance，比如我们修改了某个管脚的输入输出属性，选择 updata current，你会发现在 design cache 中多出了一个名叫 AD8056 的 instance，看看后面的来源地址，不是元件库地址，而是本设计的数据库。这样在你的设计中有两个 instance，虽然都是 AD8056，但是属性不同，可以认为不是同一种元件。如果再放置第三个 AD8056，你就可以选这两个 instance 中的任何一个。</p> <p>白色部分为 instance 属性，黄色部分为 occurence 属性</p> <ol><li>在平坦式电路中，黄色部分是默认不显示的。</li> <li>在层次式电路中，黄色部分会显示。</li></ol> <p>如果这两个区域的 Reference 不同，以黄色区域为准。只要不进行 BACKANNOTATE 操作就没有问题。</p> <p>如果想让黄色区域的 Refernece 和白色区域的 Refernece 一样，执行如下操作 Design/Remove Occurrences Properties 指令去掉 Occurrence 属性。</p> <p>如果想让白色区域的Refernece和黄色区域的Refernece一样，执行如下操作Accessories ‐ tran occ prop to instance ‐ push occ prop to instance 即可。</p> <p>其实你在 tool‐annotate 菜单选中 Update instances 就可以对白色的 A 属性重新编号，然后再选中 Update Occurences 就可以对黄色的 B 属性编号，这时 A B 便会统一。</p> <h3 id="解决"><a href="#解决" class="header-anchor">#</a> 解决</h3> <p>重新编号
<img src="/blog/assets/img/image-20240402-1.91bd9ed1.png" alt=""> <img src="/blog/assets/img/image-20240402-2.90219e1a.png" alt=""> <img src="/blog/assets/img/image-20240402-3.2fc911e4.png" alt="">
操作完后，元件白色区域的位号就已经重新编号完了，接下来就是按照同样的做法给元件黄色区域的位号进行重新编号
<img src="/blog/assets/img/image-20240402-4.29482dbd.png" alt=""> <img src="/blog/assets/img/image-20240402-5.5e486ee0.png" alt="">
操作完之后，元件黄色区域的位号也重新编号完成了
